<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dallas Bouff' Menu</title>
<link rel="manifest" href="manifest-menu.json">
<meta name="theme-color" content="#F5C04A">
<meta name="apple-mobile-web-app-title" content="Dallas Bouff'">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #080808; --surface: #111111; --raised: #171717;
    --mango: #F5C04A; --palm: #5C8A63; --chili: #C4432B;
    --cream: #FFFFFF; --creamDim: #8F8F8F; --line: #242424;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; }
  .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:700; letter-spacing:-0.5px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 90px; }
  input, textarea { width:100%; font-family:'Work Sans',sans-serif; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:11px 13px; color:var(--cream); font-size:14px; margin-bottom:10px; }
  input::placeholder, textarea::placeholder { color: var(--creamDim); }
  .btn-primary { border:none; border-radius:9px; padding:11px 16px; font-weight:700; font-size:13.5px;
    cursor:pointer; color:#080808; background: var(--mango); font-family:'Work Sans',sans-serif; }
  .btn-outline { background:none; border:1px solid var(--line); color:var(--creamDim); border-radius:8px;
    padding:6px 12px; font-size:12px; cursor:pointer; font-family:'Work Sans',sans-serif; }
  .btn-danger { background:none; border:1px solid var(--chili); color:var(--chili); border-radius:8px;
    padding:7px 12px; font-size:12px; cursor:pointer; font-family:'Work Sans',sans-serif; }
  .dish { background: linear-gradient(155deg, var(--raised), var(--surface)); border:1px solid var(--line);
    border-radius:12px; padding:14px; margin-bottom:12px; display:flex; gap:12px; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .dish img { width:64px; height:64px; border-radius:10px; object-fit:cover; background:var(--bg); flex-shrink:0; }
  .dish-emoji { width:64px; height:64px; border-radius:10px; background:var(--bg); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:28px; }
  .avatar { font-family:'Bebas Neue',sans-serif; }
  .dish-info { flex:1; min-width:0; }
  .dish-actions { display:flex; gap:8px; margin-top:8px; }
  .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  a.back { color: var(--creamDim); font-size:12px; text-decoration:none; }
  .form-box { background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:20px; }
  .form-title { font-size:13px; font-weight:700; color: var(--mango); margin-bottom:10px; }
  .empty { text-align:center; padding:30px; color:var(--creamDim); font-size:13px; border:1px dashed var(--line); border-radius:10px; }
  .status-msg { font-size:12px; margin-bottom:10px; display:none; }
  .status-msg.ok { color: var(--palm); }
  .status-msg.err { color: var(--chili); }
  .login-box { max-width:340px; margin: 60px auto 0; }
  .error-msg { color: var(--chili); font-size:13px; margin-bottom:10px; display:none; }
  .photo-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .photo-row input[type=file] { font-size:12px; margin-bottom:0; padding:8px; }
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto; z-index:60;
    background:rgba(27,22,19,0.95); backdrop-filter:blur(10px); border-top:1px solid var(--line);
    display:flex; justify-content:space-around; padding:8px 6px calc(8px + env(safe-area-inset-bottom)); }
  .nav-item { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--creamDim); cursor:pointer; font-family:'Work Sans',sans-serif; font-size:10px; font-weight:600;
    letter-spacing:0.03em; padding:4px 14px; text-decoration:none; }
  .nav-item svg { width:21px; height:21px; stroke:var(--creamDim); fill:none; stroke-width:1.7; }
  .nav-item.active { color:var(--mango); }
  .nav-item.active svg { stroke:var(--mango); }
</style>
</head>
<body>

<!-- ⚠️ Mêmes valeurs que dans index.html -->
<script>
  const SUPABASE_URL = "https://gdkcrazrejzpwzxbhpxp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_1cijZWLbC-Em1Q9o3UwpvA_VLmNtmwi";
</script>

<div class="wrap">

  <!-- Écran de connexion -->
  <div id="login-screen" class="login-box">
    <div class="mono" style="text-align:center; font-size:11px; letter-spacing:0.18em; color:var(--mango); margin-bottom:8px;">DALLAS BOUF'</div>
    <div class="display" style="font-size:30px; text-align:center; margin-bottom:4px;">Mon Menu</div>
    <div style="font-size:13px; color:var(--creamDim); text-align:center; margin-bottom:20px;">Connectez-vous pour gérer vos plats</div>
    <div id="login-error" class="error-msg"></div>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
    <button class="btn-primary" style="width:100%;" onclick="login()">Se connecter</button>
    <div style="text-align:center; margin-top:16px;"><a class="back" href="index.html">← Retour à l'app client</a></div>
  </div>

  <!-- Écran gestion du menu -->
  <div id="menu-screen" style="display:none;">
    <div class="header-row">
      <div>
        <div class="display" style="font-size:24px;"><span id="restaurant-name"></span></div>
        <a class="back" href="dashboard.html">← Tableau de bord</a>
      </div>
      <button class="btn-outline" onclick="logout()">Déconnexion</button>
    </div>

    <div class="form-box">
      <div class="form-title" id="form-title">Ajouter un plat</div>
      <div id="form-status" class="status-msg"></div>
      <input id="dish-name" type="text" placeholder="Nom du plat" />
      <textarea id="dish-desc" placeholder="Description (optionnel)" rows="2"></textarea>
      <input id="dish-price" type="number" placeholder="Prix (en F CFA)" />
      <div class="photo-row">
        <input id="dish-photo" type="file" accept="image/*" />
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-primary" onclick="saveDish()" id="save-btn">Ajouter le plat</button>
        <button class="btn-outline" style="display:none;" id="cancel-edit-btn" onclick="cancelEdit()">Annuler</button>
      </div>
    </div>

    <div id="dishes-list"></div>
  </div>

</div>

<nav class="bottom-nav" id="bottom-nav" style="display:none;">
  <a class="nav-item" href="dashboard.html">
    <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
    <span>Commandes</span>
  </a>
  <a class="nav-item active" href="menu.html">
    <svg viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 4 0V3"/><path d="M9 10v11"/><path d="M17 3c-1.5 0-2.5 1.5-2.5 4s1 4 2.5 4v10"/></svg>
    <span>Mon Menu</span>
  </a>
  <a class="nav-item" href="stats.html">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-7"/></svg>
    <span>Statistiques</span>
  </a>
</nav>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let myRestaurant = null;
let editingDishId = null;

function money(n) { return Number(n).toLocaleString('fr-FR') + ' F'; }

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = "Email ou mot de passe incorrect.";
    errEl.style.display = 'block';
    return;
  }
  await afterLogin();
}

async function afterLogin() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) return;

  const { data: rest, error } = await client.from('restaurants').select('*').eq('owner_email', user.email).maybeSingle();
  if (error || !rest) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = "Ce compte n'est relié à aucun restaurant.";
    errEl.style.display = 'block';
    await client.auth.signOut();
    return;
  }

  myRestaurant = rest;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('menu-screen').style.display = 'block';
  document.getElementById('bottom-nav').style.display = 'flex';
  document.getElementById('restaurant-name').textContent = rest.name;
  loadDishes();
}

async function logout() {
  await client.auth.signOut();
  myRestaurant = null;
  document.getElementById('menu-screen').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
}

function showStatus(msg, ok) {
  const el = document.getElementById('form-status');
  el.textContent = msg;
  el.className = 'status-msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 4000);
}

async function loadDishes() {
  const { data, error } = await client.from('menu_items').select('*').eq('restaurant_id', myRestaurant.id).order('created_at');
  const el = document.getElementById('dishes-list');
  if (error) { el.innerHTML = '<div class="empty">Erreur de chargement.</div>'; return; }
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">Aucun plat pour le moment. Ajoutez-en un ci-dessus !</div>'; return; }

  el.innerHTML = data.map(d => `
    <div class="dish">
      ${d.photo_url ? `<img src="${d.photo_url}" alt="${d.name}" />` : `<div class="dish-emoji avatar" style="color:var(--mango); font-size:22px;">${(d.name||'?').trim().charAt(0).toUpperCase()}</div>`}
      <div class="dish-info">
        <div style="font-weight:700; font-size:14.5px;">${d.name}</div>
        ${d.description ? `<div style="font-size:12.5px; color:var(--creamDim); margin-top:2px;">${d.description}</div>` : ''}
        <div class="mono" style="font-size:13px; color:var(--mango); margin-top:4px;">${money(d.price)}</div>
        <div class="dish-actions">
          <button class="btn-outline" onclick='editDish(${JSON.stringify(d).replace(/'/g, "&apos;")})'>Modifier</button>
          <button class="btn-danger" onclick="deleteDish('${d.id}')">Supprimer</button>
        </div>
      </div>
    </div>
  `).join('');
}

function editDish(d) {
  editingDishId = d.id;
  document.getElementById('form-title').textContent = 'Modifier le plat';
  document.getElementById('dish-name').value = d.name || '';
  document.getElementById('dish-desc').value = d.description || '';
  document.getElementById('dish-price').value = d.price || '';
  document.getElementById('save-btn').textContent = 'Enregistrer les modifications';
  document.getElementById('cancel-edit-btn').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function cancelEdit() {
  editingDishId = null;
  document.getElementById('form-title').textContent = 'Ajouter un plat';
  document.getElementById('dish-name').value = '';
  document.getElementById('dish-desc').value = '';
  document.getElementById('dish-price').value = '';
  document.getElementById('dish-photo').value = '';
  document.getElementById('save-btn').textContent = 'Ajouter le plat';
  document.getElementById('cancel-edit-btn').style.display = 'none';
}

async function uploadPhotoIfAny() {
  const fileInput = document.getElementById('dish-photo');
  const file = fileInput.files[0];
  if (!file) return null;

  const ext = file.name.split('.').pop();
  const path = `${myRestaurant.id}/${crypto.randomUUID()}.${ext}`;
  const { error } = await client.storage.from('menu-photos').upload(path, file);
  if (error) {
    showStatus("Erreur d'envoi de la photo : " + error.message, false);
    return null;
  }
  const { data } = client.storage.from('menu-photos').getPublicUrl(path);
  return data.publicUrl;
}

async function saveDish() {
  const name = document.getElementById('dish-name').value.trim();
  const description = document.getElementById('dish-desc').value.trim();
  const price = parseInt(document.getElementById('dish-price').value, 10);

  if (!name || !price) {
    showStatus("Merci de remplir au moins le nom et le prix.", false);
    return;
  }

  document.getElementById('save-btn').textContent = 'Enregistrement...';
  const photoUrl = await uploadPhotoIfAny();

  const payload = { name, description, price };
  if (photoUrl) payload.photo_url = photoUrl;

  let error;
  if (editingDishId) {
    ({ error } = await client.from('menu_items').update(payload).eq('id', editingDishId));
  } else {
    payload.restaurant_id = myRestaurant.id;
    ({ error } = await client.from('menu_items').insert(payload));
  }

  if (error) {
    showStatus("Erreur : " + error.message, false);
    document.getElementById('save-btn').textContent = editingDishId ? 'Enregistrer les modifications' : 'Ajouter le plat';
    return;
  }

  showStatus(editingDishId ? "Plat modifié !" : "Plat ajouté !", true);
  cancelEdit();
  loadDishes();
}

async function deleteDish(id) {
  if (!confirm("Supprimer ce plat du menu ?")) return;
  const { error } = await client.from('menu_items').delete().eq('id', id);
  if (error) { showStatus("Erreur lors de la suppression.", false); return; }
  loadDishes();
}

(async () => {
  const { data: { session } } = await client.auth.getSession();
  if (session) await afterLogin();
})();
</script>

</body>
</html>
