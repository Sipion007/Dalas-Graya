<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dallas Bouff' Statistiques</title>
<link rel="manifest" href="manifest-stats.json">
<meta name="theme-color" content="#F5C04A">
<meta name="apple-mobile-web-app-title" content="Dallas Bouff'">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #080808; --surface: #111111; --raised: #171717;
    --mango: #F5C04A; --palm: #5C8A63; --chili: #C4432B;
    --cream: #FFFFFF; --creamDim: #8F8F8F; --line: #242424;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; min-height: 100vh; }
  .display { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight:700; letter-spacing:-0.5px; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 90px; }
  input, select { width:100%; font-family: inherit; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:12px 14px; color:var(--cream); font-size:15px; margin-bottom:12px; }
  .btn-primary { width:100%; border:none; border-radius:9px; padding:13px 12px; font-weight:700; font-size:14px;
    cursor:pointer; color:#080808; background: var(--mango); margin-top:6px; }
  .btn-outline { background:none; border:1px solid var(--line); color:var(--creamDim); border-radius:8px;
    padding:6px 12px; font-size:12px; cursor:pointer; }
  .error-msg { color: var(--chili); font-size:13px; margin-bottom:10px; display:none; }
  .login-box { max-width:340px; margin: 60px auto 0; }
  a.back { color: var(--creamDim); font-size:12px; text-decoration:none; }
  .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .stats-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:20px; }
  .stat-card { background: var(--raised); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .stat-label { font-size:11px; color:var(--creamDim); text-transform:uppercase; letter-spacing:0.5px; }
  .stat-value { font-size:26px; font-weight:700; color:var(--mango); margin-top:2px; }
  .section-title { font-size:13px; font-weight:700; color: var(--mango); margin: 22px 0 10px; text-transform:uppercase; letter-spacing:0.5px; }
  .rank-row { display:flex; justify-content:space-between; align-items:center; background:var(--surface);
    border:1px solid var(--line); border-radius:9px; padding:11px 13px; margin-bottom:7px; font-size:13.5px; }
  .rank-num { color:var(--creamDim); font-size:12px; margin-right:8px; }
  .bar-row { margin-bottom:8px; }
  .bar-row-top { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:4px; }
  .bar-track { height:8px; background:var(--surface); border-radius:4px; overflow:hidden; }
  .bar-fill { height:100%; background:var(--mango); border-radius:4px; }
  .empty { text-align:center; padding:24px; color:var(--creamDim); font-size:13px; border:1px dashed var(--line); border-radius:10px; }
  .kicker { font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.16em; color:var(--mango); margin-bottom:8px; }
  .bottom-nav { position:fixed; bottom:0; left:0; right:0; max-width:560px; margin:0 auto; z-index:60;
    background:#0D0D0D; border-top:1px solid #242424; height:83px;
    display:flex; justify-content:space-around; align-items:center; padding-bottom: env(safe-area-inset-bottom); }
  .nav-item { background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:5px;
    color:#777; cursor:pointer; font-size:10px; min-width:70px; text-decoration:none; }
  .nav-item svg { width:23px; height:23px; stroke:#777; fill:none; stroke-width:1.7; }
  .nav-item.active { color:var(--mango); font-weight:600; }
  .nav-item.active svg { stroke:var(--mango); }
</style>
</head>
<body>

<!-- ⚠️ Mêmes valeurs que dans index.html -->
<script>
  const SUPABASE_URL = "https://gdkcrazrejzpwzxbhpxp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_1cijZWLbC-Em1Q9o3UwpvA_VLmNtmwi";
</script>

<div class="wrap">

  <!-- Écran de connexion -->
  <div id="login-screen" class="login-box">
    <div class="kicker" style="text-align:center;">DALLAS BOUFF'</div>
    <div class="display" style="font-size:30px; text-align:center; margin-bottom:4px;">Statistiques</div>
    <div style="font-size:13px; color:var(--creamDim); text-align:center; margin-bottom:20px;">Connectez-vous pour voir votre activité</div>
    <div id="login-error" class="error-msg"></div>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
    <button class="btn-primary" onclick="login()">Se connecter</button>
  </div>

  <!-- Écran statistiques -->
  <div id="stats-screen" style="display:none;">
    <div class="header-row">
      <div>
        <div class="display" style="font-size:24px;"><span id="restaurant-name"></span></div>
        <a class="back" href="dashboard.html">← Tableau de bord</a>
      </div>
      <button class="btn-outline" onclick="logout()">Déconnexion</button>
    </div>

    <select id="period-select" onchange="renderAll()">
      <option value="today">Aujourd'hui</option>
      <option value="week">Cette semaine</option>
      <option value="month" selected>Ce mois</option>
      <option value="all">Depuis le début</option>
    </select>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Encaissé</div>
        <div class="stat-value mono" id="stat-revenue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Commandes</div>
        <div class="stat-value" id="stat-orders">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Plats vendus</div>
        <div class="stat-value" id="stat-dishes">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Panier moyen</div>
        <div class="stat-value mono" id="stat-avg">—</div>
      </div>
    </div>

    <div class="section-title">Plats les plus vendus</div>
    <div id="top-dishes"></div>

    <div class="section-title">Gammes de prix les plus demandées</div>
    <div id="price-ranges"></div>

    <div class="section-title">Heures d'affluence</div>
    <div id="peak-hours"></div>
  </div>

</div>

<nav class="bottom-nav" id="bottom-nav" style="display:none;">
  <a class="nav-item" href="dashboard.html">
    <svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="13" y2="16"/></svg>
    <span>Commandes</span>
  </a>
  <a class="nav-item" href="menu.html">
    <svg viewBox="0 0 24 24"><path d="M7 3v7a2 2 0 0 0 4 0V3"/><path d="M9 10v11"/><path d="M17 3c-1.5 0-2.5 1.5-2.5 4s1 4 2.5 4v10"/></svg>
    <span>Mon Menu</span>
  </a>
  <a class="nav-item active" href="stats.html">
    <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-7"/></svg>
    <span>Statistiques</span>
  </a>
</nav>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let myRestaurant = null;
let allOrders = [];

function money(n) { return Number(n).toLocaleString('fr-FR') + ' F'; }

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = "Email ou mot de passe incorrect.";
    errEl.style.display = 'block';
    return;
  }
  await afterLogin();
}

async function afterLogin() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) return;

  const { data: rest, error } = await client.from('restaurants').select('*').eq('owner_email', user.email).maybeSingle();
  if (error || !rest) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = "Ce compte n'est relié à aucun restaurant.";
    errEl.style.display = 'block';
    await client.auth.signOut();
    return;
  }

  myRestaurant = rest;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('stats-screen').style.display = 'block';
  document.getElementById('bottom-nav').style.display = 'flex';
  document.getElementById('restaurant-name').textContent = rest.name;

  await loadData();
}

async function logout() {
  await client.auth.signOut();
  myRestaurant = null;
  document.getElementById('stats-screen').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
}

async function loadData() {
  const { data } = await client.from('orders').select('*').eq('restaurant_id', myRestaurant.id).order('created_at', { ascending: false });
  allOrders = data || [];
  renderAll();
}

function getFilteredByPeriod() {
  const period = document.getElementById('period-select').value;
  const now = new Date();
  return allOrders.filter(o => {
    const d = new Date(o.created_at);
    if (period === 'today') return d.toDateString() === now.toDateString();
    if (period === 'week') {
      const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
      return d >= weekAgo;
    }
    if (period === 'month') return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
    return true;
  });
}

function priceRangeLabel(price) {
  if (price < 1000) return 'Moins de 1 000 F';
  if (price < 2000) return '1 000 – 2 000 F';
  if (price < 3500) return '2 000 – 3 500 F';
  if (price < 5000) return '3 500 – 5 000 F';
  return 'Plus de 5 000 F';
}

function renderAll() {
  const filtered = getFilteredByPeriod();
  const delivered = filtered; // on compte toutes les commandes passées, quel que soit leur statut actuel

  const revenue = delivered.reduce((sum, o) => sum + Number(o.total), 0);
  const orderCount = delivered.length;
  const dishCount = {};
  const priceRangeCount = {};
  const hourCount = {};
  let totalDishesSold = 0;

  delivered.forEach(o => {
    const hour = new Date(o.created_at).getHours();
    hourCount[hour] = (hourCount[hour] || 0) + 1;

    (o.items || []).forEach(item => {
      dishCount[item.name] = (dishCount[item.name] || 0) + item.qty;
      totalDishesSold += item.qty;
      const label = priceRangeLabel(item.price);
      priceRangeCount[label] = (priceRangeCount[label] || 0) + item.qty;
    });
  });

  document.getElementById('stat-revenue').textContent = money(revenue);
  document.getElementById('stat-orders').textContent = orderCount;
  document.getElementById('stat-dishes').textContent = totalDishesSold;
  document.getElementById('stat-avg').textContent = orderCount > 0 ? money(Math.round(revenue / orderCount)) : '—';

  // Plats les plus vendus
  const sortedDishes = Object.entries(dishCount).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const dishEl = document.getElementById('top-dishes');
  dishEl.innerHTML = sortedDishes.length === 0
    ? '<div class="empty">Aucune vente sur cette période.</div>'
    : sortedDishes.map(([name, qty], i) =>
        `<div class="rank-row"><span><span class="rank-num">#${i+1}</span>${name}</span><span class="mono">${qty}×</span></div>`
      ).join('');

  // Gammes de prix
  const rangeOrder = ['Moins de 1 000 F', '1 000 – 2 000 F', '2 000 – 3 500 F', '3 500 – 5 000 F', 'Plus de 5 000 F'];
  const maxRangeCount = Math.max(1, ...Object.values(priceRangeCount));
  const rangeEl = document.getElementById('price-ranges');
  const activeRanges = rangeOrder.filter(r => priceRangeCount[r]);
  rangeEl.innerHTML = activeRanges.length === 0
    ? '<div class="empty">Aucune donnée pour cette période.</div>'
    : activeRanges.map(r => `
        <div class="bar-row">
          <div class="bar-row-top"><span>${r}</span><span class="mono">${priceRangeCount[r]} plats</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(priceRangeCount[r] / maxRangeCount) * 100}%;"></div></div>
        </div>
      `).join('');

  // Heures d'affluence
  const maxHourCount = Math.max(1, ...Object.values(hourCount));
  const sortedHours = Object.entries(hourCount).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const hourEl = document.getElementById('peak-hours');
  hourEl.innerHTML = sortedHours.length === 0
    ? '<div class="empty">Aucune donnée pour cette période.</div>'
    : sortedHours.map(([h, count]) => `
        <div class="bar-row">
          <div class="bar-row-top"><span>${h}h – ${(Number(h)+1)%24}h</span><span class="mono">${count} commande${count > 1 ? 's' : ''}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(count / maxHourCount) * 100}%;"></div></div>
        </div>
      `).join('');
}

(async () => {
  const { data: { session } } = await client.auth.getSession();
  if (session) await afterLogin();
})();
</script>

</body>
</html>
