<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dallas Graya — Tableau de bord restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #1B1613; --surface: #241D18; --raised: #2C231D;
    --mango: #E8873A; --palm: #5C8A63; --chili: #C4432B;
    --cream: #F5EFE6; --creamDim: #B8AA98; --line: #3A3029;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font-family: 'Work Sans', sans-serif; min-height: 100vh; }
  .display { font-family: 'Bebas Neue', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 40px; }
  input, select { width:100%; font-family:'Work Sans',sans-serif; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:12px 14px; color:var(--cream); font-size:15px; margin-bottom:12px; }
  input::placeholder { color: var(--creamDim); }
  .btn-primary { width:100%; border:none; border-radius:9px; padding:13px 12px; font-weight:700; font-size:14px;
    cursor:pointer; color:#1B1613; background: var(--mango); font-family:'Work Sans',sans-serif; margin-top:6px; }
  .btn-logout { background:none; border:1px solid var(--line); color:var(--creamDim); border-radius:8px;
    padding:6px 12px; font-size:12px; cursor:pointer; font-family:'Work Sans',sans-serif; }
  .order { background: linear-gradient(155deg, var(--raised), var(--surface)); border:1px solid var(--line);
    border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 4px 16px rgba(0,0,0,.25); }
  .order-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .badge { font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
  .line-item { font-family:'JetBrains Mono',monospace; font-size:12px; display:flex; justify-content:space-between; color:var(--creamDim); }
  .btn-advance { width:100%; border:none; border-radius:9px; padding:10px 12px; font-weight:700; font-size:12.5px;
    cursor:pointer; color:#1B1613; margin-top:10px; font-family:'Work Sans',sans-serif; }
  .empty { text-align:center; padding:30px; color:var(--creamDim); font-size:13px; border:1px dashed var(--line); border-radius:10px; }
  .refresh { text-align:center; font-size:11px; color:var(--creamDim); margin-top:16px; }
  a.back { color: var(--creamDim); font-size:12px; text-decoration:none; }
  .error-msg { color: var(--chili); font-size:13px; margin-bottom:10px; display:none; }
  .header-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .login-box { max-width:340px; margin: 60px auto 0; }
  .driver-assign { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .driver-assign select { margin-bottom:8px; }
  .driver-info { font-size:12.5px; color:var(--palm); margin-top:8px; border-top:1px solid var(--line); padding-top:8px; }
  .waiting-note { font-size:11.5px; color:var(--creamDim); text-align:center; margin-top:6px; }
</style>
</head>
<body>

<!-- ⚠️ Mêmes valeurs que dans index.html -->
<script>
  const SUPABASE_URL = "https://gdkcrazrejzpwzxbhpxp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_1cijZWLbC-Em1Q9o3UwpvA_VLmNtmwi";
</script>

<div class="wrap">

  <!-- Écran de connexion -->
  <div id="login-screen" class="login-box">
    <div class="mono" style="text-align:center; font-size:11px; letter-spacing:0.18em; color:var(--mango); margin-bottom:8px;">DALLAS GRAYA</div>
    <div class="display" style="font-size:30px; text-align:center; margin-bottom:4px;">Espace restaurant</div>
    <div style="font-size:13px; color:var(--creamDim); text-align:center; margin-bottom:20px;">Connectez-vous pour gérer vos commandes</div>
    <div id="login-error" class="error-msg"></div>
    <input id="login-email" type="email" placeholder="Email" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Mot de passe" autocomplete="current-password" />
    <button class="btn-primary" onclick="login()">Se connecter</button>
    <div style="text-align:center; margin-top:16px;"><a class="back" href="index.html">← App client</a> · <a class="back" href="menu.html">Mon Menu</a></div>
  </div>

  <!-- Écran tableau de bord (caché tant que non connecté) -->
  <div id="dashboard-screen" style="display:none;">
    <div class="header-row">
      <div>
        <div class="display" style="font-size:24px;"><span id="restaurant-name"></span></div>
        <a class="back" href="index.html">← App client</a> · <a class="back" href="menu.html">Mon Menu</a>
      </div>
      <button class="btn-logout" onclick="logout()">Déconnexion</button>
    </div>
    <div id="orders-list"></div>
    <div class="refresh">Actualisation automatique toutes les 10 secondes</div>
  </div>

</div>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STATUSES = ['Reçue', 'En préparation', 'Prête', 'En livraison', 'Livrée'];
const READY_IDX = STATUSES.indexOf('Prête');
let myRestaurant = null;
let myDrivers = [];
let refreshTimer = null;

function money(n) { return n.toLocaleString('fr-FR') + ' F'; }

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';

  const { data, error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = "Email ou mot de passe incorrect.";
    errEl.style.display = 'block';
    return;
  }
  await afterLogin();
}

async function afterLogin() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) return;

  const { data: rest, error } = await client.from('restaurants').select('*').eq('owner_email', user.email).maybeSingle();

  if (error || !rest) {
    const errEl = document.getElementById('login-error');
    errEl.textContent = "Ce compte n'est relié à aucun restaurant.";
    errEl.style.display = 'block';
    await client.auth.signOut();
    return;
  }

  myRestaurant = rest;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard-screen').style.display = 'block';
  document.getElementById('restaurant-name').textContent = rest.name;

  const { data: drivers } = await client.from('drivers').select('*').eq('restaurant_id', rest.id);
  myDrivers = drivers || [];

  loadOrders();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(loadOrders, 10000);
}

async function logout() {
  await client.auth.signOut();
  if (refreshTimer) clearInterval(refreshTimer);
  myRestaurant = null;
  document.getElementById('dashboard-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
}

async function loadOrders() {
  if (!myRestaurant) return;
  const { data, error } = await client.from('orders').select('*, drivers(name, phone)').eq('restaurant_id', myRestaurant.id).order('created_at', { ascending: false });
  const el = document.getElementById('orders-list');
  if (error) { el.innerHTML = '<div class="empty">Erreur de connexion.</div>'; return; }
  if (!data || data.length === 0) { el.innerHTML = '<div class="empty">Aucune commande pour le moment.</div>'; return; }

  el.innerHTML = data.map(o => {
    const idx = STATUSES.indexOf(o.status);
    const isLast = idx === STATUSES.length - 1;
    const gpsLink = o.location && o.location.type === 'gps' ? `<a href="https://www.google.com/maps?q=${o.location.lat},${o.location.lng}" target="_blank" style="color:var(--palm); font-size:12px; text-decoration:none;">Position GPS du client →</a>` : '';

    let actionZone = '';
    if (idx < READY_IDX) {
      actionZone = `<button class="btn-advance" style="background:${myRestaurant.accent};" onclick="advance('${o.id}','${STATUSES[idx+1]}')">Marquer « ${STATUSES[idx+1]} »</button>`;
    } else if (idx === READY_IDX && !o.driver_id) {
      const driverOptions = myDrivers.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
      actionZone = `
        <div class="driver-assign">
          ${myDrivers.length > 0 ? `
            <select id="driver-select-${o.id}">
              <option value="">Choisir un de vos livreurs…</option>
              ${driverOptions}
            </select>
            <button class="btn-advance" style="background:${myRestaurant.accent};" onclick="assignDriver('${o.id}')">Assigner ce livreur</button>
          ` : ''}
          <div class="waiting-note">Commande visible aussi par les livreurs indépendants disponibles</div>
        </div>
      `;
    } else if (idx === STATUSES.indexOf('En livraison')) {
      actionZone = `<div class="driver-info">En livraison par ${o.drivers ? o.drivers.name + ' · ' + o.drivers.phone : 'un livreur'}</div>`;
    } else if (isLast) {
      actionZone = `<div style="text-align:center; font-size:12px; color:var(--creamDim); margin-top:8px;">Commande terminée</div>`;
    }

    return `
      <div class="order">
        <div class="order-top">
          <div class="mono" style="font-weight:700; font-size:13px;">#${o.id.slice(0,8).toUpperCase()}</div>
          <div class="badge" style="background:${isLast ? 'var(--palm)' : 'var(--bg)'}; color:${isLast ? 'var(--cream)' : 'var(--mango)'}; border:${isLast ? 'none' : '1px solid var(--mango)'};">${o.status}</div>
        </div>
        <div style="font-size:13px; margin-bottom:2px;">${o.customer_name} · ${o.phone}</div>
        ${o.address ? `<div style="font-size:12.5px; color:var(--creamDim); margin-bottom:6px;">${o.address}</div>` : ''}
        ${gpsLink}
        <div style="border-top:1px solid var(--line); padding-top:8px; margin-top:8px;">
          ${o.items.map(i => `<div class="line-item"><span>${i.qty}× ${i.name}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
          <div class="line-item" style="font-weight:700; color:var(--cream); margin-top:4px;"><span>Total</span><span>${money(o.total)}</span></div>
        </div>
        ${actionZone}
      </div>
    `;
  }).join('');
}

async function advance(orderId, newStatus) {
  await client.from('orders').update({ status: newStatus }).eq('id', orderId);
  loadOrders();
}

async function assignDriver(orderId) {
  const sel = document.getElementById('driver-select-' + orderId);
  const driverId = sel.value;
  if (!driverId) { alert("Choisissez un livreur dans la liste."); return; }
  await client.from('orders').update({ driver_id: driverId, status: 'En livraison' }).eq('id', orderId);
  loadOrders();
}

// Si déjà connecté (session existante), on saute directement au dashboard
(async () => {
  const { data: { session } } = await client.auth.getSession();
  if (session) await afterLogin();
})();
</script>

</body>
</html>
