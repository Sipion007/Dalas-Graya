  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  });
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri, Maxar, Earthstar Geographics', maxZoom: 19, maxNativeZoom: 16
  });
  const satelliteLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, maxNativeZoom: 16, pane: 'shadowPane'
  });
  const hybride = L.layerGroup([satellite, satelliteLabels]);

  streets.addTo(map);
  L.control.layers({ 'Rues (recommandé)': streets, 'Satellite': hybride }, null, { collapsed: true }).addTo(map);
  L.control.scale({ imperial: false }).addTo(map);
}

function money(n) { return n.toLocaleString('fr-FR') + ' F'; }
function initial(name) { return (name || '?').trim().charAt(0).toUpperCase(); }

function isRestaurantOpen(r) {
  if (!r.opens_at || !r.closes_at) return true; // pas d'horaires définis = toujours ouvert
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const openMin = toMin(r.opens_at);
  const closeMin = toMin(r.closes_at);
  if (openMin <= closeMin) {
    return nowMin >= openMin && nowMin < closeMin;
  }
  // horaires à cheval sur minuit (ex: 18:00 → 02:00)
  return nowMin >= openMin || nowMin < closeMin;
}

function formatHM(t) { return t ? t.slice(0, 5) : ''; }

function openStatusBadge(r) {
  if (!r.opens_at || !r.closes_at) return '';
  const open = isRestaurantOpen(r);
  return open
    ? `<span class="status-badge status-open">Ouvert</span>`
    : `<span class="status-badge status-closed">Fermé · réouvre à ${formatHM(r.opens_at)}</span>`;
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function show(view) {
  ['list','menu','checkout','confirm','account','orders','offers','tracking'].forEach(v => {
    document.getElementById('view-' + v).style.display = (v === view) ? 'block' : 'none';
  });
  if (view !== 'tracking') stopTracking();
  const nav = document.getElementById('bottom-nav');
  nav.style.display = ['list','account','orders','offers'].includes(view) ? 'flex' : 'none';
  window.scrollTo({ top: 0 });
}

function setActiveNav(id) {
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const el = document.getElementById('nav-' + id);
  if (el) el.classList.add('active');
}

function navTo(dest) {
  if (dest === 'home') {
    setActiveNav('home');
    show('list');
  } else if (dest === 'restaurants') {
    setActiveNav('restaurants');
    show('list');
    setTimeout(() => document.querySelector('.list')?.scrollIntoView({ behavior: 'smooth' }), 30);
  } else if (dest === 'commandes') {
    setActiveNav('commandes');
    if (currentCustomer) { show('orders'); renderOrders(); }
    else { show('account'); renderAccount(); }
  } else if (dest === 'profil') {
    setActiveNav('profil');
    show('account'); renderAccount();
  }
}

async function signupCustomer() {
  const name = document.getElementById('su-name').value.trim();
  const phone = document.getElementById('su-phone').value.trim();
  const password = document.getElementById('su-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  if (!name || !phone || password.length < 6) {
    errEl.textContent = "Merci de remplir tous les champs (mot de passe : 6 caractères minimum).";
    errEl.style.display = 'block';
    return;
  }

  const email = phoneToEmail(phone);
  const { data, error } = await client.auth.signUp({ email, password });
  if (error) {
    errEl.textContent = error.message.includes('already') ? "Ce numéro a déjà un compte. Essayez de vous connecter." : "Erreur lors de la création du compte.";
    errEl.style.display = 'block';
    return;
  }

  const { error: custError } = await client.from('customers').insert({
    auth_user_id: data.user.id, phone, name
  });
  if (custError) {
    errEl.textContent = "Erreur lors de la création du profil.";
    errEl.style.display = 'block';
    return;
  }

  await refreshCustomer();
  toast("Compte créé, bienvenue !");
  renderAccount();
}

  const phone = document.getElementById('li-phone').value.trim();

let trackingTimer = null;
let trackingMap = null;
let trackingMarker = null;
let trackingDestMarker = null;

const ORDER_STEPS = ['Reçue', 'En préparation', 'Prête', 'En livraison', 'Livrée'];
const ORDER_STEP_LABELS = { 'Reçue': 'Commande reçue', 'En préparation': 'En préparation', 'Prête': 'Prête à partir', 'En livraison': 'En route vers vous', 'Livrée': 'Livrée' };

function timelineHtml(status) {
  const idx = ORDER_STEPS.indexOf(status);
  return `
    <div class="timeline">
      ${ORDER_STEPS.map((s, i) => {
        const done = i <= idx;
        const isLast = i === ORDER_STEPS.length - 1;
        return `
          <div class="timeline-step">
            <div class="timeline-dot-col">
              <div class="timeline-dot ${done ? 'done' : ''}"></div>
              ${!isLast ? `<div class="timeline-bar ${i < idx ? 'done' : ''}"></div>` : ''}
            </div>
            <div class="timeline-label ${done ? 'done' : ''}">${ORDER_STEP_LABELS[s]}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

async function trackDelivery(orderId) {
  show('tracking');
  document.getElementById('view-tracking').innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('orders'); renderOrders();">← Mes commandes</button>
      <div class="driver-badge">
        <svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.6"/><circle cx="17" cy="18" r="2.6"/><path d="M6 18l3-7h4l2 4h2"/><path d="M9 11l2-4h3"/></svg>
      </div>
      <div class="display" style="font-size:24px; text-align:center; margin-bottom:4px;">Votre commande</div>
      <div class="track-status" id="track-status" style="margin-bottom:18px;">Localisation du livreur…</div>
      <div id="track-driver-slot"></div>
      <div id="track-timeline"></div>
      <div id="tracking-map"></div>
    </div>
  `;

  await updateTrackingView(orderId);
  if (trackingTimer) clearInterval(trackingTimer);
  trackingTimer = setInterval(() => updateTrackingView(orderId), 8000);
}

function stopTracking() {
  if (trackingTimer) { clearInterval(trackingTimer); trackingTimer = null; }
  trackingMap = null; trackingMarker = null; trackingDestMarker = null;
}

async function updateTrackingView(orderId) {
  const { data: o, error } = await client.from('orders').select('*, drivers(name, phone, current_lat, current_lng, location_updated_at)').eq('id', orderId).maybeSingle();
  if (error || !o) return;

  const statusEl = document.getElementById('track-status');
  const slotEl = document.getElementById('track-driver-slot');
  const timelineEl = document.getElementById('track-timeline');
  if (!statusEl) return; // vue quittée entre-temps

  timelineEl.innerHTML = timelineHtml(o.status);
  statusEl.textContent = ORDER_STEP_LABELS[o.status] || o.status;

  if (o.status === 'Livrée') {
    statusEl.textContent = "Commande livrée";
    if (trackingTimer) { clearInterval(trackingTimer); trackingTimer = null; }
  }

  const d = o.drivers;
  if (d) {
    slotEl.innerHTML = `
      <div class="track-driver-box">
        <div>
          <div style="font-weight:700; font-size:14.5px;">${d.name}</div>
          <div style="font-size:12px; color:var(--creamDim);">Votre livreur</div>
        </div>
        <a href="tel:${d.phone}" class="btn-call-track">Appeler</a>
      </div>
    `;
  } else {
    slotEl.innerHTML = '';
  }

  if (!d || !d.current_lat) {
    return;
  }

  const mapEl = document.getElementById('tracking-map');
  if (!trackingMap) {
    trackingMap = L.map(mapEl).setView([d.current_lat, d.current_lng], 16);
    equipMap(trackingMap);
    trackingMarker = L.marker([d.current_lat, d.current_lng]).addTo(trackingMap).bindPopup('Livreur');

    if (o.location && o.location.type === 'gps') {
      trackingDestMarker = L.marker([o.location.lat, o.location.lng]).addTo(trackingMap).bindPopup('Vous');
      trackingMap.fitBounds([[d.current_lat, d.current_lng], [o.location.lat, o.location.lng]], { padding: [30,30] });
    }
  } else {
    trackingMarker.setLatLng([d.current_lat, d.current_lng]);
    trackingMap.panTo([d.current_lat, d.current_lng]);
  }
}

    <button class="category-chip" onclick="selectCategory(${c.key ? `'${c.key}'` : 'null'})">
      <div class="category-icon ${selectedCategory === c.key ? 'active' : ''}">
        <svg viewBox="0 0 24 24" stroke="${selectedCategory === c.key ? '#080808' : 'var(--mango)'}" stroke-width="1.6" fill="none">${CATEGORY_ICONS[c.icon]}</svg>
      </div>
      <div class="category-label ${selectedCategory === c.key ? 'active' : ''}">${c.label}</div>
    </button>
  `).join('');
}

function selectCategory(key) {
  selectedCategory = key;
  renderCategoryChips();
  filterRestaurants();
}

function restaurantCardsHtml(list) {
  if (list.length === 0) return '<div class="empty">Aucun restaurant ne correspond à votre recherche.</div>';
  return list.map(r => {
    const cover = restaurantCoverMap[r.id];
    const rating = restaurantRatingMap[r.id];
    const open = isRestaurantOpen(r);
    return `
        <button class="rcard2 ${open ? '' : 'closed'}" onclick="openRestaurant('${r.id}')">
          ${cover ? `<img class="rcard2-img" src="${cover.photo_url}" alt="${r.name}" />` : `<div class="rcard2-img rcard2-fallback avatar" style="background:linear-gradient(155deg, ${r.accent}33, ${r.accent}14); color:${r.accent};">${initial(r.name)}</div>`}
          <div class="rcard2-info">
            <div style="flex:1; text-align:left;">
              <div class="rcard2-name">${r.name}</div>
              <div class="rcard2-cat">${r.category || ''}</div>
              <div class="rcard2-meta">
                ${rating ? `<svg viewBox="0 0 24 24" width="14" height="14" fill="var(--mango)"><path d="M12 2l3 7h7l-5.5 4.5L18.5 21 12 16.5 5.5 21 7.5 13.5 2 9h7z"/></svg><span>${rating.avg}</span><span class="rcard2-dot"></span>` : ''}
                <svg viewBox="0 0 24 24" width="14" height="14" stroke="var(--creamDim)" stroke-width="1.6" fill="none"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
                <span>${r.delivery_time || ''}</span>
              </div>
              ${openStatusBadge(r)}
            </div>
            <div class="rcard2-arrow">
              <svg viewBox="0 0 24 24" width="18" height="18" stroke="var(--mango)" stroke-width="1.8" fill="none"><path d="M9 6l6 6-6 6"/></svg>
            </div>
          </div>
        </button>
      `;
  }).join('');
}

function filterRestaurants() {
  const q = document.getElementById('restaurant-search').value.trim().toLowerCase();
  let filtered = restaurants;
  if (selectedCategory) {
    filtered = filtered.filter(r => (r.category || '').toLowerCase().includes(selectedCategory));
  }
  if (q) {
    filtered = filtered.filter(r =>
      (r.name || '').toLowerCase().includes(q) || (r.category || '').toLowerCase().includes(q) || (r.tagline || '').toLowerCase().includes(q)
    );
  }
  document.getElementById('restaurant-list').innerHTML = restaurantCardsHtml(filtered);
}

async function openRestaurant(id) {
  currentRestaurant = restaurants.find(r => r.id === id);
  cart = {};
  updateHeaderCartBadge();
  const { data } = await client.from('menu_items').select('*').eq('restaurant_id', id);
  menuItems = data || [];
  renderMenu();
  show('menu');
}

function renderMenu() {
  const r = currentRestaurant;
  const el = document.getElementById('view-menu');
  const open = isRestaurantOpen(r);
  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="setActiveNav('home'); show('list')">← Tous les restaurants</button>
      <div class="display" style="font-size:28px; color:${r.accent}">${r.name}</div>
      <div style="font-size:13px; color:var(--creamDim); margin-bottom:8px;">${r.tagline || ''}</div>
      ${!open ? `<div class="closed-banner">Ce restaurant est actuellement fermé. Horaires : ${formatHM(r.opens_at)} – ${formatHM(r.closes_at)}. Vous pouvez consulter le menu, mais la commande n'est pas possible pour le moment.</div>` : ''}
      <div id="menu-items"></div>
    </div>
    <div id="cart-bar"></div>
  `;
  renderMenuItems();
}

function renderMenuItems() {
  const r = currentRestaurant;
  const open = isRestaurantOpen(r);
  document.getElementById('menu-items').innerHTML = menuItems.map(item => {
    const inCart = cart[item.id];
    return `
      <div class="item">
        ${item.photo_url ? `<img src="${item.photo_url}" style="width:48px; height:48px; border-radius:8px; object-fit:cover; flex-shrink:0;" />` : `<div class="item-emoji avatar" style="background:${r.accent}26; color:${r.accent}; font-size:19px;">${initial(item.name)}</div>`}
        <div style="flex:1;">
          <div style="font-weight:600; font-size:15px;">${item.name}</div>
          <div style="font-size:12.5px; color:var(--creamDim); margin-top:2px;">${item.description || ''}</div>
          <div class="mono" style="font-size:13px; color:${r.accent}; margin-top:6px;">${money(item.price)}</div>
        </div>
        ${!open ? `<button class="qty-btn" style="background:var(--line); color:var(--creamDim); cursor:not-allowed;" disabled>+</button>` : !inCart ? `
          <button class="qty-btn" style="background:${r.accent}; color:#080808;" onclick="addItem('${item.id}')">+</button>
        ` : `
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="qty-btn" style="background:var(--bg); border:1px solid var(--line); color:var(--cream);" onclick="removeItem('${item.id}')">−</button>
            <span class="mono" style="min-width:14px; text-align:center;">${inCart.qty}</span>
            <button class="qty-btn" style="background:${r.accent}; color:#080808;" onclick="addItem('${item.id}')">+</button>
          </div>
        `}
      </div>
    `;
  }).join('');
  renderCartBar();
}

function addItem(id) {
  if (!isRestaurantOpen(currentRestaurant)) { toast("Ce restaurant est fermé pour le moment."); renderMenu(); return; }
  const item = menuItems.find(i => i.id === id);
  if (cart[id]) cart[id].qty++; else cart[id] = { ...item, qty: 1 };
  renderMenuItems();
  updateHeaderCartBadge();
}
function removeItem(id) {
  if (!cart[id]) return;
  cart[id].qty--;
  if (cart[id].qty <= 0) delete cart[id];
  renderMenuItems();
  updateHeaderCartBadge();
}

function cartTotal() { return Object.values(cart).reduce((s,i) => s + i.qty * i.price, 0); }
function cartCount() { return Object.values(cart).reduce((s,i) => s + i.qty, 0); }

function updateHeaderCartBadge() {
  const badge = document.getElementById('header-cart-badge');
  if (!badge) return;
  const n = cartCount();
  badge.style.display = n > 0 ? 'flex' : 'none';
  badge.textContent = n;
}

function goToCart() {
  if (cartCount() > 0) { show('checkout'); renderCheckout(); }
  else { navTo('restaurants'); }
}

function renderCartBar() {
  const bar = document.getElementById('cart-bar');
  if (cartCount() === 0) { bar.innerHTML = ''; return; }
  const r = currentRestaurant;
  bar.innerHTML = `
    <div class="cart-bar">
      <button class="cart-btn" style="background:linear-gradient(135deg, ${r.accent}, ${r.accent}CC);" onclick="show('checkout'); renderCheckout();">
        <span>Voir le panier (${cartCount()})</span>
        <span class="mono">${money(cartTotal())}</span>
      </button>
    </div>
  `;
}

function renderCheckout() {
  const el = document.getElementById('view-checkout');

  if (!currentCustomer) {
    el.innerHTML = `
      <div class="section">
        <button class="btn-back" onclick="show('menu')">← Retour au menu</button>
        <div class="display" style="font-size:26px; margin-bottom:10px;">Un compte est nécessaire</div>
        <div style="font-size:14px; color:var(--creamDim); margin-bottom:20px;">Connectez-vous ou créez un compte pour valider votre commande.</div>
        <button class="btn-primary" onclick="openAccount()">Se connecter / Créer un compte</button>
      </div>
    `;
    return;
  }

  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('menu')">← Retour au menu</button>
      <div class="display" style="font-size:26px; margin-bottom:14px;">Votre commande</div>
      <div style="background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px;">
        ${Object.values(cart).map(i => `
          <div class="ticket-line" style="color:var(--cream);"><span>${i.qty}× ${i.name}</span><span>${money(i.qty*i.price)}</span></div>
        `).join('')}
        <div class="ticket-line" style="border-top:1px solid var(--line); margin-top:8px; padding-top:8px; font-weight:700; color:var(--cream);"><span>Total</span><span>${money(cartTotal())}</span></div>
      </div>

      <label>Nom</label>
      <input id="f-name" placeholder="Votre nom" value="${currentCustomer.name || ''}" />
      <label>Téléphone</label>
      <input id="f-phone" placeholder="07 00 00 00 00" value="${currentCustomer.phone || ''}" />

      <label>Position de livraison</label>
      <div class="loc-btns">
        <button class="loc-btn" id="btn-gps" onclick="useGPS()">Utiliser ma position</button>
      </div>
      <div id="loc-status" style="margin-bottom:10px;"></div>

      <label>Repère (optionnel)</label>
      <input id="f-address" placeholder="Ex: portail bleu, près de la pharmacie" />

      <button class="btn-primary" id="btn-order" onclick="placeOrder()">Valider la commande — Paiement à la livraison</button>
    </div>
  `;
}

function useGPS() {
  document.getElementById('loc-status').innerHTML = 'Recherche de votre position…';
  if (!navigator.geolocation) { toast("Géolocalisation non disponible sur cet appareil"); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      location_ = { type: 'gps', lat: pos.coords.latitude, lng: pos.coords.longitude };
      document.getElementById('loc-status').innerHTML = `<div class="mono" style="font-size:11.5px; color:var(--palm);">GPS : ${location_.lat.toFixed(4)}, ${location_.lng.toFixed(4)}</div>`;
      document.getElementById('btn-gps').classList.add('active');
    },
    () => { toast("Position refusée — indiquez un repère ci-dessous"); },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

async function placeOrder() {
  if (!currentCustomer) { openAccount(); return; }
  if (!isRestaurantOpen(currentRestaurant)) { toast("Ce restaurant est fermé pour le moment."); show('menu'); renderMenu(); return; }
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const address = document.getElementById('f-address').value.trim();
  if (!name || !phone || !(location_ || address)) { toast("Complétez au moins le nom, le téléphone et une position"); return; }

  const items = Object.values(cart).map(i => ({ itemId: i.id, name: i.name, price: i.price, qty: i.qty }));
  const total = cartTotal();

  const orderId = crypto.randomUUID();
  const payload = {
    id: orderId,
    restaurant_id: currentRestaurant.id,
    customer_name: name,
    phone, address,
    location: location_,
    items, total,
    status: 'Reçue'
  };
  if (currentCustomer) payload.customer_id = currentCustomer.id;

  const { error } = await client.from('orders').insert(payload);

  if (error) { toast("Erreur lors de l'envoi de la commande"); console.error(error); return; }

  renderConfirmation({ ...payload, created_at: new Date().toISOString() });
  show('confirm');
}

function renderConfirmation(order) {
  const r = currentRestaurant;
  const el = document.getElementById('view-confirm');
  const waLink = r.whatsapp ? `https://wa.me/${r.whatsapp}?text=${encodeURIComponent('Nouvelle commande Dallas Graya #' + order.id.slice(0,8) + ' — ' + order.total + ' F — ' + order.customer_name)}` : null;
  el.innerHTML = `
    <div class="section" style="text-align:center;">
      <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--palm),#3F6B48); display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">✓</div>
      <div class="display" style="font-size:26px;">Commande envoyée</div>
      <div style="font-size:13px; color:var(--creamDim); margin-bottom:20px;">${r.name} va recevoir votre commande.</div>
    </div>
    <div class="section" style="padding-top:0;">
      <div class="ticket">
        <div style="text-align:center; margin-bottom:10px;">
          <div class="display" style="font-size:20px; letter-spacing:0.06em;">DALLAS GRAYA</div>
          <div class="mono" style="font-size:10px; color:#6B5F52;">TAZIBOU · TICKET DE COMMANDE</div>
        </div>
        <div style="border-top:1.5px dashed #B8AA98; border-bottom:1.5px dashed #B8AA98; padding:10px 0; margin:10px 0;">
          <div class="ticket-line"><span>N° COMMANDE</span><span>${order.id.slice(0,8).toUpperCase()}</span></div>
          <div class="ticket-line"><span>RESTAURANT</span><span>${r.name}</span></div>
          <div class="ticket-line"><span>CLIENT</span><span>${order.customer_name}</span></div>
        </div>
        ${order.items.map(i => `<div class="ticket-line"><span>${i.qty}× ${i.name}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
        <div class="ticket-line" style="border-top:1.5px dashed #B8AA98; margin-top:10px; padding-top:10px; font-weight:700;"><span>TOTAL</span><span>${money(order.total)}</span></div>
      </div>
      ${waLink ? `<a href="${waLink}" target="_blank" style="display:block; text-align:center; margin-top:14px; background:var(--palm); color:var(--cream); padding:13px; border-radius:10px; text-decoration:none; font-weight:600; font-size:13px;">Confirmer par WhatsApp</a>` : ''}
      <button class="btn-secondary" style="margin-top:12px;" onclick="resetOrder()">Commander ailleurs</button>
    </div>
  `;
}

function resetOrder() {
  cart = {}; location_ = null; currentRestaurant = null;
  updateHeaderCartBadge();
  setActiveNav('home');
  show('list');
}

// ---------- Installation de l'app (bannière) ----------

let deferredInstallPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS() {
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner('android');
});

function showInstallBanner(platform) {
  if (isStandalone()) return;
  const banner = document.getElementById('install-banner');
  const sub = document.getElementById('install-banner-sub');
  const btn = document.getElementById('install-banner-btn');
  if (platform === 'ios') {
    sub.textContent = "Appuyez sur Partager, puis « Sur l'écran d'accueil »";
    btn.style.display = 'none';
  } else {
    sub.textContent = "Accédez à l'app en un clic depuis votre écran d'accueil";
    btn.style.display = 'inline-block';
  }
  banner.style.display = 'flex';
}

async function handleInstallClick() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  dismissInstallBanner();
}

function dismissInstallBanner() {
  document.getElementById('install-banner').style.display = 'none';
}

(async () => {
  await loadRestaurants();
  await refreshCustomer();
  if (isIOS() && !isStandalone()) showInstallBanner('ios');
})();
</script>
</body>
</html>
