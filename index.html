<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Maquis Express — Tazibou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #1B1613; --surface: #241D18; --raised: #2C231D;
    --mango: #E8873A; --palm: #5C8A63; --chili: #C4432B;
    --cream: #F5EFE6; --creamDim: #B8AA98; --line: #3A3029;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: radial-gradient(circle at 15% -10%, #2E2419 0%, var(--bg) 45%), var(--bg);
    color: var(--cream); font-family: 'Work Sans', sans-serif; min-height: 100vh; }
  .display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .wrap { max-width: 480px; margin: 0 auto; padding-bottom: 100px; }
  .topbar { position: sticky; top: 0; z-index: 50; background: rgba(27,22,19,0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line); padding: 14px 16px; display:flex; align-items:center; gap:8px; justify-content:space-between; }
  .topbar-left { display:flex; align-items:center; gap:8px; }
  .topbar-icons { display:flex; align-items:center; gap:14px; }
  .topbar-icon { background:none; border:none; color:var(--creamDim); font-size:19px; cursor:pointer; padding:2px; position:relative; }
  .dot { width:8px; height:8px; border-radius:50%; background: var(--mango); animation: glow 2.4s ease-in-out infinite; }
  @keyframes glow { 0%,100% { opacity:.5 } 50% { opacity:1 } }
  .hero { padding: 30px 16px 24px; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
  .kicker { font-size: 11px; color: var(--mango); letter-spacing: .18em; margin-bottom: 8px; }
  .headline { font-size: 38px; line-height: .95; margin-bottom: 10px; }
  .headline span { color: var(--mango); }
  .tagline { font-style: italic; color: var(--creamDim); margin-bottom: 14px; }
  .pill { display:inline-block; font-size:10.5px; background: var(--raised); border:1px solid var(--line);
    padding:6px 11px; border-radius:20px; margin-right:6px; margin-bottom:6px; }
  .list { padding: 0 16px; display:flex; flex-direction:column; gap:12px; }
  .card { text-align:left; background: linear-gradient(155deg, var(--raised), var(--surface));
    border:1px solid var(--line); border-radius:14px; padding:16px; cursor:pointer; color:var(--cream);
    display:flex; gap:14px; box-shadow:0 4px 16px rgba(0,0,0,.25); width:100%; }
  .emoji-box { width:56px; height:56px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:28px; flex-shrink:0; }
  .rname { font-size: 22px; font-family:'Bebas Neue',sans-serif; }
  .rcat { font-size:12.5px; font-weight:600; margin-top:2px; }
  .rtag { font-size:13px; color:var(--creamDim); margin-top:4px; }
  .rtime { font-size:10.5px; color:var(--creamDim); margin-top:8px; }
  .btn-back { background:none; border:none; color:var(--creamDim); display:flex; align-items:center; gap:6px; cursor:pointer; padding:0; margin-bottom:12px; font-family:'Work Sans',sans-serif; font-size:13px; }
  .item { background: var(--raised); border:1px solid var(--line); border-radius:12px; padding:12px 14px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .item-emoji { width:48px; height:48px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; }
  .qty-btn { border:none; border-radius:8px; width:30px; height:30px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; }
  .cart-bar { position:fixed; bottom:0; left:0; right:0; max-width:480px; margin:0 auto; padding:12px; }
  .cart-btn { width:100%; border:none; border-radius:12px; padding:15px 18px; display:flex; justify-content:space-between;
    align-items:center; cursor:pointer; color:#1B1613; font-weight:700; font-size:14px; box-shadow:0 10px 28px rgba(232,135,58,.4); }
  input, textarea { width:100%; font-family:'Work Sans',sans-serif; background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:10px 12px; color:var(--cream); font-size:14px; margin-bottom:10px; }
  input::placeholder, textarea::placeholder { color: var(--creamDim); }
  label { font-size:12.5px; color:var(--creamDim); display:block; margin-bottom:6px; }
  .section { padding: 18px 16px; }
  .ticket { background: var(--cream); color:#2A2119; border-radius:6px; padding:20px 22px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  .ticket-line { display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:12px; margin-bottom:4px; }
  .btn-primary { width:100%; border:none; border-radius:12px; padding:15px 18px; font-weight:700; font-size:14px;
    cursor:pointer; color:#1B1613; background:linear-gradient(135deg,var(--mango),#D4762E); box-shadow:0 10px 28px rgba(232,135,58,.35); }
  .btn-secondary { width:100%; background:none; border:1px solid var(--line); border-radius:12px; padding:13px 18px;
    color:var(--cream); font-family:'Work Sans',sans-serif; font-size:13px; cursor:pointer; }
  .loc-btns { display:flex; gap:8px; margin-bottom:10px; }
  .loc-btn { flex:1; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px 8px;
    color:var(--cream); font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Work Sans',sans-serif; }
  .loc-btn.active { border-color: var(--mango); color: var(--mango); }
  .toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--palm); color:var(--cream);
    padding:12px 18px; border-radius:10px; font-size:14px; z-index:100; box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:90vw; }
  .footer-link { text-align:center; padding: 20px 16px 40px; }
  .footer-link a { color: var(--creamDim); font-size:12px; text-decoration:none; }
  .empty { text-align:center; padding:30px; color:var(--creamDim); font-size:13px; }
  .error-msg { color: var(--chili); font-size:13px; margin-bottom:10px; display:none; }
  .tab-switch { display:flex; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:3px; margin-bottom:18px; }
  .tab-btn { flex:1; text-align:center; padding:9px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; color:var(--creamDim); }
  .tab-btn.active { background:var(--mango); color:#1B1613; }
  .profile-box { background: linear-gradient(155deg, var(--raised), var(--surface)); border:1px solid var(--line);
    border-radius:14px; padding:18px; margin-bottom:16px; }
  .order-hist { background: var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px; }
  .order-hist-top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; }
  .badge { font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--bg); color:var(--mango); border:1px solid var(--mango); }
  .badge.done { background:var(--palm); color:var(--cream); border:none; }
  .stars { display:flex; gap:4px; margin: 8px 0; }
  .star { font-size:22px; cursor:pointer; color: var(--line); }
  .star.filled { color: var(--mango); }
  .promo-card { background: linear-gradient(155deg, var(--raised), var(--surface)); border:1px solid var(--mango);
    border-radius:12px; padding:14px; margin-bottom:12px; }
  .promo-rest { font-size:11px; color:var(--mango); font-weight:700; margin-bottom:4px; }
  #tracking-map { width:100%; height:320px; border-radius:12px; border:1px solid var(--line); margin-bottom:14px; }
  .track-driver-box { background: linear-gradient(155deg, var(--raised), var(--surface)); border:1px solid var(--line);
    border-radius:12px; padding:14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
  .btn-call-track { display:inline-block; border:1px solid var(--palm); color:var(--palm); border-radius:8px;
    padding:8px 14px; font-size:12.5px; font-weight:700; text-decoration:none; font-family:'Work Sans',sans-serif; }
  .track-status { text-align:center; font-size:12.5px; color:var(--creamDim); margin-bottom:10px; }
</style>
</head>
<body>

<!-- ⚠️ Mêmes valeurs que dans les autres fichiers -->
<script>
  const SUPABASE_URL = "https://gdkcrazrejzpwzxbhpxp.supabase.co";
  const SUPABASE_KEY = "sb_publishable_1cijZWLbC-Em1Q9o3UwpvA_VLmNtmwi";
</script>

<div class="topbar">
  <div class="topbar-left">
    <span class="dot"></span>
    <span class="display" style="font-size:21px; color:var(--mango);">MAQUIS EXPRESS</span>
  </div>
  <div class="topbar-icons">
    <button class="topbar-icon" onclick="show('offers'); renderOffers();" title="Offres">🎁</button>
    <button class="topbar-icon" onclick="openAccount()" title="Mon compte">👤</button>
  </div>
</div>

<div class="wrap" id="app">
  <div id="view-list"></div>
  <div id="view-menu" style="display:none"></div>
  <div id="view-checkout" style="display:none"></div>
  <div id="view-confirm" style="display:none"></div>
  <div id="view-account" style="display:none"></div>
  <div id="view-orders" style="display:none"></div>
  <div id="view-offers" style="display:none"></div>
  <div id="view-tracking" style="display:none"></div>
</div>

<div class="footer-link"><a href="dashboard.html">Espace restaurant →</a></div>

<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let restaurants = [];
let currentRestaurant = null;
let menuItems = [];
let cart = {};
let location_ = null;
let currentCustomer = null; // { id, phone, name, auth_user_id }

function money(n) { return n.toLocaleString('fr-FR') + ' F'; }
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}
function show(view) {
  ['list','menu','checkout','confirm','account','orders','offers','tracking'].forEach(v => {
    document.getElementById('view-' + v).style.display = (v === view) ? 'block' : 'none';
  });
  if (view !== 'tracking') stopTracking();
  window.scrollTo({ top: 0 });
}

function phoneToEmail(phone) {
  const clean = phone.replace(/\s+/g, '');
  return clean + '@maquisexpress.local';
}

// ---------- Comptes clients ----------

async function refreshCustomer() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) { currentCustomer = null; return; }
  const { data } = await client.from('customers').select('*').eq('auth_user_id', user.id).maybeSingle();
  currentCustomer = data || null;
}

function openAccount() {
  show('account');
  renderAccount();
}

function renderAccount() {
  const el = document.getElementById('view-account');
  if (currentCustomer) {
    el.innerHTML = `
      <div class="section">
        <button class="btn-back" onclick="show('list')">← Retour</button>
        <div class="display" style="font-size:26px; margin-bottom:14px;">👤 Mon compte</div>
        <div class="profile-box">
          <div style="font-weight:700; font-size:16px;">${currentCustomer.name || 'Client'}</div>
          <div class="mono" style="font-size:13px; color:var(--creamDim); margin-top:2px;">${currentCustomer.phone}</div>
        </div>
        <button class="btn-secondary" style="margin-bottom:10px;" onclick="show('orders'); renderOrders();">📦 Mes commandes</button>
        <button class="btn-secondary" style="margin-bottom:10px;" onclick="show('offers'); renderOffers();">🎁 Offres</button>
        <button class="btn-secondary" onclick="logoutCustomer()">Déconnexion</button>
      </div>
    `;
    return;
  }

  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('list')">← Retour</button>
      <div class="display" style="font-size:26px; margin-bottom:14px;">👤 Mon compte</div>
      <div class="tab-switch">
        <div class="tab-btn active" id="tab-login" onclick="switchAuthTab('login')">Connexion</div>
        <div class="tab-btn" id="tab-signup" onclick="switchAuthTab('signup')">Créer un compte</div>
      </div>
      <div id="auth-error" class="error-msg"></div>

      <div id="form-login">
        <label>Téléphone</label>
        <input id="li-phone" placeholder="07 00 00 00 00" />
        <label>Mot de passe</label>
        <input id="li-password" type="password" placeholder="Votre mot de passe" />
        <button class="btn-primary" onclick="loginCustomer()">Se connecter</button>
      </div>

      <div id="form-signup" style="display:none;">
        <label>Nom</label>
        <input id="su-name" placeholder="Votre nom" />
        <label>Téléphone</label>
        <input id="su-phone" placeholder="07 00 00 00 00" />
        <label>Mot de passe</label>
        <input id="su-password" type="password" placeholder="Choisissez un mot de passe" />
        <button class="btn-primary" onclick="signupCustomer()">Créer mon compte</button>
      </div>
    </div>
  `;
}

function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('auth-error').style.display = 'none';
}

async function signupCustomer() {
  const name = document.getElementById('su-name').value.trim();
  const phone = document.getElementById('su-phone').value.trim();
  const password = document.getElementById('su-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  if (!name || !phone || password.length < 6) {
    errEl.textContent = "Merci de remplir tous les champs (mot de passe : 6 caractères minimum).";
    errEl.style.display = 'block';
    return;
  }

  const email = phoneToEmail(phone);
  const { data, error } = await client.auth.signUp({ email, password });
  if (error) {
    errEl.textContent = error.message.includes('already') ? "Ce numéro a déjà un compte. Essayez de vous connecter." : "Erreur lors de la création du compte.";
    errEl.style.display = 'block';
    return;
  }

  const { error: custError } = await client.from('customers').insert({
    auth_user_id: data.user.id, phone, name
  });
  if (custError) {
    errEl.textContent = "Erreur lors de la création du profil.";
    errEl.style.display = 'block';
    return;
  }

  await refreshCustomer();
  toast("Compte créé, bienvenue !");
  renderAccount();
}

async function loginCustomer() {
  const phone = document.getElementById('li-phone').value.trim();
  const password = document.getElementById('li-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  const email = phoneToEmail(phone);
  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = "Téléphone ou mot de passe incorrect.";
    errEl.style.display = 'block';
    return;
  }

  await refreshCustomer();
  toast("Connecté !");
  renderAccount();
}

async function logoutCustomer() {
  await client.auth.signOut();
  currentCustomer = null;
  renderAccount();
}

// ---------- Historique des commandes + avis ----------

async function renderOrders() {
  const el = document.getElementById('view-orders');
  if (!currentCustomer) { show('account'); renderAccount(); return; }

  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('account'); renderAccount();">← Mon compte</button>
      <div class="display" style="font-size:26px; margin-bottom:14px;">📦 Mes commandes</div>
      <div id="orders-hist-list"></div>
    </div>
  `;

  const { data: orders } = await client.from('orders').select('*').eq('phone', currentCustomer.phone).order('created_at', { ascending: false });
  const { data: myReviews } = await client.from('reviews').select('order_id').eq('customer_id', currentCustomer.id);
  const reviewedOrderIds = new Set((myReviews || []).map(r => r.order_id));

  const listEl = document.getElementById('orders-hist-list');
  if (!orders || orders.length === 0) {
    listEl.innerHTML = '<div class="empty">Vous n\'avez pas encore commandé.</div>';
    return;
  }

  listEl.innerHTML = orders.map(o => {
    const r = restaurants.find(x => x.id === o.restaurant_id);
    const date = new Date(o.created_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
    const canReview = o.status === 'Livrée' && !reviewedOrderIds.has(o.id);
    const canTrack = o.status === 'En livraison' && o.driver_id;
    return `
      <div class="order-hist">
        <div class="order-hist-top">
          <div class="mono" style="font-weight:700; font-size:12.5px;">#${o.id.slice(0,8).toUpperCase()}</div>
          <div class="badge ${o.status === 'Livrée' ? 'done' : ''}">${o.status}</div>
        </div>
        <div style="font-size:13.5px; margin-top:4px;">${r ? r.name : '—'} · ${date}</div>
        <div class="mono" style="font-size:13px; margin-top:4px; color:var(--mango);">${money(o.total)}</div>
        ${canTrack ? `<button class="btn-secondary" style="margin-top:8px;" onclick="trackDelivery('${o.id}')">🛵 Suivre le trajet en direct</button>` : ''}
        ${canReview ? `<button class="btn-secondary" style="margin-top:8px;" onclick='openReview(${JSON.stringify({id:o.id, restaurant_id:o.restaurant_id, rname:(r?r.name:'')}).replace(/'/g,"&apos;")})'>⭐ Noter ce restaurant</button>` : ''}
      </div>
    `;
  }).join('');
}

let reviewTarget = null;
let selectedRating = 0;

function openReview(order) {
  reviewTarget = order;
  selectedRating = 0;
  const modal = document.createElement('div');
  modal.id = 'review-modal';
  modal.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;';
  modal.innerHTML = `
    <div style="background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; max-width:340px; width:100%;">
      <div class="display" style="font-size:20px; margin-bottom:4px;">Noter ${order.rname}</div>
      <div class="stars" id="star-picker">
        ${[1,2,3,4,5].map(n => `<span class="star" data-n="${n}" onclick="setRating(${n})">★</span>`).join('')}
      </div>
      <textarea id="review-comment" placeholder="Un commentaire (optionnel)" rows="3"></textarea>
      <button class="btn-primary" onclick="submitReview()">Envoyer</button>
      <button class="btn-secondary" style="margin-top:8px;" onclick="closeReview()">Annuler</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function setRating(n) {
  selectedRating = n;
  document.querySelectorAll('#star-picker .star').forEach(s => {
    s.classList.toggle('filled', Number(s.dataset.n) <= n);
  });
}

function closeReview() {
  const m = document.getElementById('review-modal');
  if (m) m.remove();
}

async function submitReview() {
  if (selectedRating === 0) { toast("Choisissez une note (1 à 5 étoiles)"); return; }
  const comment = document.getElementById('review-comment').value.trim();
  const { error } = await client.from('reviews').insert({
    restaurant_id: reviewTarget.restaurant_id,
    customer_id: currentCustomer.id,
    order_id: reviewTarget.id,
    rating: selectedRating,
    comment
  });
  if (error) { toast("Erreur lors de l'envoi de l'avis."); return; }
  closeReview();
  toast("Merci pour votre avis !");
  renderOrders();
}

// ---------- Offres ----------

async function renderOffers() {
  const el = document.getElementById('view-offers');
  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('list')">← Retour</button>
      <div class="display" style="font-size:26px; margin-bottom:14px;">🎁 Offres du moment</div>
      <div id="offers-list"></div>
    </div>
  `;
  const { data: promos } = await client.from('promotions').select('*').eq('active', true).order('created_at', { ascending: false });
  const listEl = document.getElementById('offers-list');
  if (!promos || promos.length === 0) {
    listEl.innerHTML = '<div class="empty">Aucune offre active pour le moment.</div>';
    return;
  }
  listEl.innerHTML = promos.map(p => {
    const r = restaurants.find(x => x.id === p.restaurant_id);
    return `
      <div class="promo-card">
        <div class="promo-rest">${r ? r.name : ''}</div>
        <div style="font-weight:700; font-size:15px;">${p.title}</div>
        ${p.description ? `<div style="font-size:13px; color:var(--creamDim); margin-top:4px;">${p.description}</div>` : ''}
      </div>
    `;
  }).join('');
}

// ---------- Suivi en direct de la livraison ----------

let trackingTimer = null;
let trackingMap = null;
let trackingMarker = null;
let trackingDestMarker = null;

async function trackDelivery(orderId) {
  show('tracking');
  document.getElementById('view-tracking').innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('orders'); renderOrders();">← Mes commandes</button>
      <div class="display" style="font-size:26px; margin-bottom:10px;">🛵 Suivi en direct</div>
      <div id="track-driver-slot"></div>
      <div class="track-status" id="track-status">Localisation du livreur…</div>
      <div id="tracking-map"></div>
    </div>
  `;

  await updateTrackingView(orderId);
  if (trackingTimer) clearInterval(trackingTimer);
  trackingTimer = setInterval(() => updateTrackingView(orderId), 8000);
}

function stopTracking() {
  if (trackingTimer) { clearInterval(trackingTimer); trackingTimer = null; }
  trackingMap = null; trackingMarker = null; trackingDestMarker = null;
}

async function updateTrackingView(orderId) {
  const { data: o, error } = await client.from('orders').select('*, drivers(name, phone, current_lat, current_lng, location_updated_at)').eq('id', orderId).maybeSingle();
  if (error || !o) return;

  const statusEl = document.getElementById('track-status');
  const slotEl = document.getElementById('track-driver-slot');
  if (!statusEl) return; // vue quittée entre-temps

  if (o.status === 'Livrée') {
    statusEl.textContent = "✅ Commande livrée !";
    if (trackingTimer) { clearInterval(trackingTimer); trackingTimer = null; }
  }

  const d = o.drivers;
  if (d) {
    slotEl.innerHTML = `
      <div class="track-driver-box">
        <div>
          <div style="font-weight:700; font-size:14.5px;">${d.name}</div>
          <div style="font-size:12px; color:var(--creamDim);">Votre livreur</div>
        </div>
        <a href="tel:${d.phone}" class="btn-call-track">📞 Appeler</a>
      </div>
    `;
  }

  if (!d || !d.current_lat) {
    statusEl.textContent = "En attente de la position du livreur…";
    return;
  }

  if (o.status !== 'Livrée') {
    const ageSec = (Date.now() - new Date(d.location_updated_at).getTime()) / 1000;
    statusEl.textContent = ageSec < 40 ? "Position en direct" : "Dernière position connue (livreur peut-être hors ligne)";
  }

  const mapEl = document.getElementById('tracking-map');
  if (!trackingMap) {
    trackingMap = L.map(mapEl).setView([d.current_lat, d.current_lng], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(trackingMap);
    trackingMarker = L.marker([d.current_lat, d.current_lng]).addTo(trackingMap).bindPopup('🛵 Livreur');

    if (o.location && o.location.type === 'gps') {
      trackingDestMarker = L.marker([o.location.lat, o.location.lng]).addTo(trackingMap).bindPopup('📍 Vous');
      trackingMap.fitBounds([[d.current_lat, d.current_lng], [o.location.lat, o.location.lng]], { padding: [30,30] });
    }
  } else {
    trackingMarker.setLatLng([d.current_lat, d.current_lng]);
    trackingMap.panTo([d.current_lat, d.current_lng]);
  }
}

// ---------- Restaurants / menu / commande ----------

async function loadRestaurants() {
  const { data, error } = await client.from('restaurants').select('*').order('created_at');
  if (error) { document.getElementById('view-list').innerHTML = '<div class="empty">Erreur de connexion à la base.</div>'; return; }
  restaurants = data;
  renderList();
}

function renderList() {
  const el = document.getElementById('view-list');
  el.innerHTML = `
    <div class="hero">
      <div class="kicker">TAZIBOU · CÔTE D'IVOIRE</div>
      <div class="display headline">Les maquis de<br>votre quartier,<br><span>livrés chez vous.</span></div>
      <div class="tagline">Commandez vos plats préférés, payez à la réception.</div>
      <div>
        <span class="pill mono">${restaurants.length} RESTAURANTS PARTENAIRES</span>
        <span class="pill mono">LIVRAISON LE JOUR MÊME</span>
      </div>
    </div>
    <div class="list">
      ${restaurants.map(r => `
        <button class="card" onclick="openRestaurant('${r.id}')">
          <div class="emoji-box" style="background:linear-gradient(155deg, ${r.accent}33, ${r.accent}14); border:1px solid ${r.accent}40;">${r.emoji || '🍽️'}</div>
          <div style="flex:1; text-align:left;">
            <div class="rname">${r.name}</div>
            <div class="rcat" style="color:${r.accent}">${r.category || ''}</div>
            <div class="rtag">${r.tagline || ''}</div>
            <div class="rtime mono">⏱ ${r.delivery_time || ''}</div>
          </div>
        </button>
      `).join('')}
    </div>
  `;
}

async function openRestaurant(id) {
  currentRestaurant = restaurants.find(r => r.id === id);
  cart = {};
  const { data } = await client.from('menu_items').select('*').eq('restaurant_id', id);
  menuItems = data || [];
  renderMenu();
  show('menu');
}

function renderMenu() {
  const r = currentRestaurant;
  const el = document.getElementById('view-menu');
  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('list')">← Tous les restaurants</button>
      <div class="display" style="font-size:28px; color:${r.accent}">${r.name}</div>
      <div style="font-size:13px; color:var(--creamDim); margin-bottom:14px;">${r.tagline || ''}</div>
      <div id="menu-items"></div>
    </div>
    <div id="cart-bar"></div>
  `;
  renderMenuItems();
}

function renderMenuItems() {
  const r = currentRestaurant;
  document.getElementById('menu-items').innerHTML = menuItems.map(item => {
    const inCart = cart[item.id];
    return `
      <div class="item">
        ${item.photo_url ? `<img src="${item.photo_url}" style="width:48px; height:48px; border-radius:8px; object-fit:cover; flex-shrink:0;" />` : `<div class="item-emoji" style="background:${r.accent}26;">${item.emoji || '🍽️'}</div>`}
        <div style="flex:1;">
          <div style="font-weight:600; font-size:15px;">${item.name}</div>
          <div style="font-size:12.5px; color:var(--creamDim); margin-top:2px;">${item.description || ''}</div>
          <div class="mono" style="font-size:13px; color:${r.accent}; margin-top:6px;">${money(item.price)}</div>
        </div>
        ${!inCart ? `
          <button class="qty-btn" style="background:${r.accent}; color:#1B1613;" onclick="addItem('${item.id}')">+</button>
        ` : `
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="qty-btn" style="background:var(--bg); border:1px solid var(--line); color:var(--cream);" onclick="removeItem('${item.id}')">−</button>
            <span class="mono" style="min-width:14px; text-align:center;">${inCart.qty}</span>
            <button class="qty-btn" style="background:${r.accent}; color:#1B1613;" onclick="addItem('${item.id}')">+</button>
          </div>
        `}
      </div>
    `;
  }).join('');
  renderCartBar();
}

function addItem(id) {
  const item = menuItems.find(i => i.id === id);
  if (cart[id]) cart[id].qty++; else cart[id] = { ...item, qty: 1 };
  renderMenuItems();
}
function removeItem(id) {
  if (!cart[id]) return;
  cart[id].qty--;
  if (cart[id].qty <= 0) delete cart[id];
  renderMenuItems();
}

function cartTotal() { return Object.values(cart).reduce((s,i) => s + i.qty * i.price, 0); }
function cartCount() { return Object.values(cart).reduce((s,i) => s + i.qty, 0); }

function renderCartBar() {
  const bar = document.getElementById('cart-bar');
  if (cartCount() === 0) { bar.innerHTML = ''; return; }
  const r = currentRestaurant;
  bar.innerHTML = `
    <div class="cart-bar">
      <button class="cart-btn" style="background:linear-gradient(135deg, ${r.accent}, ${r.accent}CC);" onclick="show('checkout'); renderCheckout();">
        <span>🛍 Voir le panier (${cartCount()})</span>
        <span class="mono">${money(cartTotal())}</span>
      </button>
    </div>
  `;
}

function renderCheckout() {
  const el = document.getElementById('view-checkout');
  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('menu')">← Retour au menu</button>
      <div class="display" style="font-size:26px; margin-bottom:14px;">Votre commande</div>
      <div style="background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:16px;">
        ${Object.values(cart).map(i => `
          <div class="ticket-line" style="color:var(--cream);"><span>${i.qty}× ${i.name}</span><span>${money(i.qty*i.price)}</span></div>
        `).join('')}
        <div class="ticket-line" style="border-top:1px solid var(--line); margin-top:8px; padding-top:8px; font-weight:700; color:var(--cream);"><span>Total</span><span>${money(cartTotal())}</span></div>
      </div>

      <label>Nom</label>
      <input id="f-name" placeholder="Votre nom" value="${currentCustomer ? currentCustomer.name : ''}" />
      <label>Téléphone</label>
      <input id="f-phone" placeholder="07 00 00 00 00" value="${currentCustomer ? currentCustomer.phone : ''}" />

      <label>Position de livraison</label>
      <div class="loc-btns">
        <button class="loc-btn" id="btn-gps" onclick="useGPS()">📍 Utiliser ma position</button>
      </div>
      <div id="loc-status" style="margin-bottom:10px;"></div>

      <label>Repère (optionnel)</label>
      <input id="f-address" placeholder="Ex: portail bleu, près de la pharmacie" />

      <button class="btn-primary" id="btn-order" onclick="placeOrder()">Valider la commande — Paiement à la livraison</button>
    </div>
  `;
}

function useGPS() {
  document.getElementById('loc-status').innerHTML = 'Recherche de votre position…';
  if (!navigator.geolocation) { toast("Géolocalisation non disponible sur cet appareil"); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      location_ = { type: 'gps', lat: pos.coords.latitude, lng: pos.coords.longitude };
      document.getElementById('loc-status').innerHTML = `<div class="mono" style="font-size:11.5px; color:var(--palm);">📍 GPS: ${location_.lat.toFixed(4)}, ${location_.lng.toFixed(4)}</div>`;
      document.getElementById('btn-gps').classList.add('active');
    },
    () => { toast("Position refusée — indiquez un repère ci-dessous"); },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

async function placeOrder() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const address = document.getElementById('f-address').value.trim();
  if (!name || !phone || !(location_ || address)) { toast("Complétez au moins le nom, le téléphone et une position"); return; }

  const items = Object.values(cart).map(i => ({ itemId: i.id, name: i.name, price: i.price, qty: i.qty }));
  const total = cartTotal();

  const orderId = crypto.randomUUID();
  const payload = {
    id: orderId,
    restaurant_id: currentRestaurant.id,
    customer_name: name,
    phone, address,
    location: location_,
    items, total,
    status: 'Reçue'
  };
  if (currentCustomer) payload.customer_id = currentCustomer.id;

  const { error } = await client.from('orders').insert(payload);

  if (error) { toast("Erreur lors de l'envoi de la commande"); console.error(error); return; }

  renderConfirmation({ ...payload, created_at: new Date().toISOString() });
  show('confirm');
}

function renderConfirmation(order) {
  const r = currentRestaurant;
  const el = document.getElementById('view-confirm');
  const waLink = r.whatsapp ? `https://wa.me/${r.whatsapp}?text=${encodeURIComponent('Nouvelle commande Maquis Express #' + order.id.slice(0,8) + ' — ' + order.total + ' F — ' + order.customer_name)}` : null;
  el.innerHTML = `
    <div class="section" style="text-align:center;">
      <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--palm),#3F6B48); display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">✓</div>
      <div class="display" style="font-size:26px;">Commande envoyée</div>
      <div style="font-size:13px; color:var(--creamDim); margin-bottom:20px;">${r.name} va recevoir votre commande.</div>
    </div>
    <div class="section" style="padding-top:0;">
      <div class="ticket">
        <div style="text-align:center; margin-bottom:10px;">
          <div class="display" style="font-size:20px;">MAQUIS EXPRESS</div>
          <div class="mono" style="font-size:10px; color:#6B5F52;">TAZIBOU · TICKET DE COMMANDE</div>
        </div>
        <div style="border-top:1.5px dashed #B8AA98; border-bottom:1.5px dashed #B8AA98; padding:10px 0; margin:10px 0;">
          <div class="ticket-line"><span>N° COMMANDE</span><span>${order.id.slice(0,8).toUpperCase()}</span></div>
          <div class="ticket-line"><span>RESTAURANT</span><span>${r.name}</span></div>
          <div class="ticket-line"><span>CLIENT</span><span>${order.customer_name}</span></div>
        </div>
        ${order.items.map(i => `<div class="ticket-line"><span>${i.qty}× ${i.name}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
        <div class="ticket-line" style="border-top:1.5px dashed #B8AA98; margin-top:10px; padding-top:10px; font-weight:700;"><span>TOTAL</span><span>${money(order.total)}</span></div>
      </div>
      ${waLink ? `<a href="${waLink}" target="_blank" style="display:block; text-align:center; margin-top:14px; background:var(--palm); color:var(--cream); padding:13px; border-radius:10px; text-decoration:none; font-weight:600; font-size:13px;">📲 Confirmer par WhatsApp</a>` : ''}
      <button class="btn-secondary" style="margin-top:12px;" onclick="resetOrder()">Commander ailleurs</button>
    </div>
  `;
}

function resetOrder() {
  cart = {}; location_ = null; currentRestaurant = null;
  show('list');
}

(async () => {
  await loadRestaurants();
  await refreshCustomer();
})();
</script>
