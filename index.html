<script>
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });

// ---------- Session durable ----------
// Une erreur réseau passagère ne doit JAMAIS déconnecter l'utilisateur.
const SESSION_BACKUP_KEY = 'dbf-session-backup';
client.auth.onAuthStateChange((event, session) => {
  try {
    if (session && session.refresh_token) {
      localStorage.setItem(SESSION_BACKUP_KEY, JSON.stringify({ a: session.access_token, r: session.refresh_token }));
    }
  } catch (e) {}
});

function hasSessionBackup() {
  try { return !!localStorage.getItem(SESSION_BACKUP_KEY); } catch (e) { return false; }
}

async function getSessionSafe() {
  try {
    const { data } = await client.auth.getSession();
    if (data && data.session) return data.session;
  } catch (e) {}
  try {
    const raw = localStorage.getItem(SESSION_BACKUP_KEY);
    if (raw) {
      const b = JSON.parse(raw);
      const { data, error } = await client.auth.setSession({ access_token: b.a, refresh_token: b.r });
      if (data && data.session) return data.session;
      if (error && error.status && error.status >= 400 && error.status < 500) {
        localStorage.removeItem(SESSION_BACKUP_KEY);
      }
    }
  } catch (e) {}
  return null;
}

async function signOutLocal() {
  try { localStorage.removeItem(SESSION_BACKUP_KEY); } catch (e) {}
  try { await client.auth.signOut({ scope: 'local' }); } catch (e) {}
}

let restoreRunning = false;
async function restoreSession(afterFn) {
  if (restoreRunning) return;
  restoreRunning = true;
  try {
    for (let i = 0; i < 6; i++) {
      const s = await getSessionSafe();
      if (s) { await afterFn(); return; }
      if (!hasSessionBackup()) return;
      await new Promise(r => setTimeout(r, 2500));
    }
  } finally { restoreRunning = false; }
}

function onAppResume() {
  try { client.auth.startAutoRefresh(); } catch (e) {}
  try {
    if (typeof isAppLoggedIn === 'function' && isAppLoggedIn()) {
      getSessionSafe();
      if (typeof onResumeLoggedIn === 'function') onResumeLoggedIn();
    } else if (typeof afterLogin === 'function') {
      restoreSession(afterLogin);
    }
  } catch (e) {}
}

window.addEventListener('pageshow', (e) => { if (e.persisted) onAppResume(); });

  const nowMin = now.getHours() * 60 + now.getMinutes();

  if (openMin <= closeMin) {

function timeAgo(ts) {
  if (!ts) return '';
  const s = Math.max(0, Math.round((Date.now() - new Date(ts).getTime()) / 1000));
  if (s < 60) return "à l'instant";
  const m = Math.floor(s / 60);
  if (m < 60) return 'il y a ' + m + ' min';
  const h = Math.floor(m / 60);
  if (h < 24) return 'il y a ' + h + ' h' + (m % 60 ? ' ' + String(m % 60).padStart(2, '0') : '');
  return 'le ' + new Date(ts).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
}
function hhmm(ts) { return ts ? new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : ''; }
function minutesSince(ts) { return ts ? Math.floor((Date.now() - new Date(ts).getTime()) / 60000) : 0; }

const ROLE_LABEL = { client: 'Client', restaurant: 'Restaurant', driver: 'Livreur', admin: "Dallas Bouff'" };
const msgDrafts = {};
const openThreads = new Set();

function threadHtml(orderId, msgs, myRole, quick) {
  const list = (msgs || []).map(m => {
    const mine = m.sender_role === myRole;
    return `<div class="msg ${mine ? 'mine' : ''}"><div class="msg-meta">${escHtml(mine ? 'Vous' : (m.sender_name || ROLE_LABEL[m.sender_role] || ''))} · ${hhmm(m.created_at)}</div><div class="msg-body">${escHtml(m.body)}</div></div>`;
  }).join('');
  return `
    <div class="thread" data-thread="${orderId}">
      <div class="thread-list" id="thread-list-${orderId}">${list || '<div class="thread-empty">Aucun message pour cette commande.</div>'}</div>
      ${quick && quick.length ? `<div class="quick-row">${quick.map(q => `<button type="button" class="quick" data-quick="${orderId}" data-text="${escHtml(q)}">${escHtml(q)}</button>`).join('')}</div>` : ''}
      <div class="thread-send">
        <textarea id="msg-input-${orderId}" data-draft="${orderId}" maxlength="500" rows="2" placeholder="Écrire un message…">${escHtml(msgDrafts[orderId] || '')}</textarea>
        <button type="button" class="send-btn" data-send="${orderId}">Envoyer</button>
      </div>
    </div>`;
}

async function sendThreadMessage(orderId, text, onDone) {
  const body = String(text || '').trim();
  if (!body) return;
  const { error } = await client.rpc('send_order_message', { p_order: orderId, p_body: body });
  if (error) { alert("Le message n'est pas parti. Vérifiez votre connexion et réessayez."); return; }
  msgDrafts[orderId] = '';
  const ta = document.getElementById('msg-input-' + orderId);
  if (ta) ta.value = '';
  if (onDone) onDone();
}

function bindThreadEvents(onSent) {
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t && t.dataset && t.dataset.draft) msgDrafts[t.dataset.draft] = t.value;
  });
  document.addEventListener('click', (e) => {
    const q = e.target.closest('[data-quick]');
    if (q) { sendThreadMessage(q.dataset.quick, q.dataset.text, onSent); return; }
    const s = e.target.closest('[data-send]');
    if (s) { const id = s.dataset.send; const ta = document.getElementById('msg-input-' + id); sendThreadMessage(id, ta ? ta.value : '', onSent); return; }
    const tg = e.target.closest('[data-toggle-thread]');
    if (tg) { const id = tg.dataset.toggleThread; if (openThreads.has(id)) openThreads.delete(id); else openThreads.add(id); if (onSent) onSent(true); }
  });
}

// Garde le champ en cours de saisie et la position des fils quand la liste est redessinée
function renderKeepingFocus(el, html) {
  const a = document.activeElement;
  const keepId = a && el.contains(a) && a.id ? a.id : null;
  const sel = keepId && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  const scrolls = {};
  el.querySelectorAll('.thread-list').forEach(t => { scrolls[t.id] = t.scrollTop; });
  const values = {};
  el.querySelectorAll('select[id], input[id]').forEach(x => { values[x.id] = x.value; });
  el.innerHTML = html;
  Object.keys(values).forEach(id => { const x = document.getElementById(id); if (x && el.contains(x) && values[id] && x.tagName === 'SELECT' && [...x.options].some(o => o.value === values[id])) x.value = values[id]; else if (x && el.contains(x) && x.tagName === 'INPUT' && x.type !== 'file') x.value = values[id]; });
  el.querySelectorAll('.thread-list').forEach(t => { t.scrollTop = (t.id in scrolls) ? scrolls[t.id] : t.scrollHeight; });
  if (keepId) { const n = document.getElementById(keepId); if (n) { n.focus({ preventScroll: true }); if (sel && n.setSelectionRange) { try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } } }
}

function compressImageFile(file, max, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const ratio = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.width * ratio));
      cv.height = Math.max(1, Math.round(img.height * ratio));
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error('compression')), 'image/jpeg', quality || 0.8);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
    img.src = url;
  });
}

function b64ToU8c(b64) { const pad = '='.repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + pad).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...raw].map(c => c.charCodeAt(0))); }
async function registerClientPush() {

  const listEl = document.getElementById('orders-hist-list');
  if (!listEl) return;
  const sig = JSON.stringify([myOrders, myOrderMsgs, [...openThreads], clientPanel]);
  if (!force && sig === ordersSig) return;
  ordersSig = sig;
  if (!myOrders.length) { listEl.innerHTML = '<div class="empty">Vous n\'avez pas encore commandé.</div>'; return; }
  renderKeepingFocus(listEl, myOrders.map(clientOrderCard).join(''));
}

function clientOrderCard(o) {
  const r = restaurants.find(x => x.id === o.restaurant_id);
  const date = new Date(o.created_at).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' }) + ' à ' + hhmm(o.created_at);
  const msgs = myOrderMsgs[o.id] || [];
  const last = msgs.slice(-1)[0];
  const unread = last && last.sender_role !== 'client';
  const finished = o.status === 'Livrée' || o.status === 'Annulée';
  let info = '';
  if (o.status === 'Reçue') info = `<div class="oi wait">Le restaurant n'a pas encore confirmé (envoyée ${timeAgo(o.created_at)}).</div>`;
  else if (o.status === 'En préparation' && o.accepted_at && o.prep_minutes) info = `<div class="oi ok">Acceptée. Prête vers ${hhmm(new Date(new Date(o.accepted_at).getTime() + o.prep_minutes * 60000))}.</div>`;
  else if (o.status === 'Annulée') info = `<div class="oi bad">Annulée${o.cancelled_by === 'client' ? ' par vous' : o.cancelled_by === 'restaurant' ? ' par le restaurant' : o.cancelled_by === 'driver' ? ' par le livreur' : ''}${o.cancel_reason ? ' : ' + escHtml(o.cancel_reason) : ''}</div>`;
  if (o.cancel_requested_at && !finished) info += `<div class="oi wait">Demande d'annulation envoyée. Le restaurant va répondre.</div>`;

  let actions = '';
  const panel = clientPanel[o.id];
  if (!finished && (o.status === 'Reçue' || ((o.status === 'En préparation' || o.status === 'Prête') && !o.cancel_requested_at))) {
    const direct = o.status === 'Reçue';
    actions += panel === 'cancel' ? `
      <div class="cp-box"><div class="cp-title">${direct ? 'Annuler ma commande' : "Demander l'annulation"}</div>
        <div class="cp-sub">${direct ? "Le restaurant n'a pas encore commencé : l'annulation est immédiate." : 'Le restaurant a déjà commencé à cuisiner : il doit accepter votre demande.'}</div>
        <div class="chips2">${CLIENT_CANCEL_REASONS.map(x => `<button type="button" class="chip2" onclick="clientCancel('${o.id}', ${JSON.stringify(x).replace(/"/g, '&quot;')})">${escHtml(x)}</button>`).join('')}</div>
        <button class="link-btn2" onclick="setClientPanel('${o.id}', '')">Garder ma commande</button></div>`
      : `<button class="link-btn2 danger" onclick="setClientPanel('${o.id}', 'cancel')">${direct ? 'Annuler ma commande' : "Demander l'annulation"}</button>`;
  }
  if (o.status === 'En livraison') {
    actions = `<button class="btn-secondary" style="margin-top:8px;" onclick="trackDelivery('${o.id}')">Suivre le trajet en direct</button>
      <button class="btn-primary" style="margin-top:8px;" onclick="confirmReceived('${o.id}')">J'ai reçu ma commande</button>`;
  }
  if (o.status === 'Livrée') actions += reviewAreaHtml(o, r);

  const showThread = !finished || msgs.length;
  const open = openThreads.has(o.id);
  return `
    <div class="order-hist ${o.status === 'Annulée' ? 'is-cancelled' : ''}">
      <div class="order-hist-top">
        <div class="mono" style="font-weight:700; font-size:12.5px;">#${o.id.slice(0, 8).toUpperCase()}</div>
        <div class="badge ${o.status === 'Livrée' ? 'done' : o.status === 'Annulée' ? 'bad' : ''}">${escHtml(o.status === 'En livraison' && !o.collected_at ? 'Le livreur récupère votre commande' : (STATUS_TEXT[o.status] || o.status))}</div>
      </div>
      <div style="font-size:13.5px; margin-top:4px;">${r ? escHtml(r.name) : '—'} · ${date}</div>
      <div class="mono" style="font-size:13px; margin-top:4px; color:var(--mango);">${money(o.total)}</div>
      ${info}
      ${o.drivers ? `<div style="display:flex; align-items:center; gap:10px; margin-top:8px;">${driverAvatar(o.drivers, 34)}<div style="font-size:12.5px; color:var(--creamDim);">${o.status === 'Livrée' ? 'Livrée par' : 'Livreur :'} <span style="color:var(--cream); font-weight:600;">${escHtml(o.drivers.name)}</span></div></div>` : ''}
      ${actions}
      ${showThread ? `<div style="margin-top:10px;"><button type="button" class="msg-toggle" data-toggle-thread="${o.id}">${unread ? '<span class="dotnew"></span>' : ''}${open ? 'Fermer les messages' : 'Écrire au restaurant'}${msgs.length ? ' (' + msgs.length + ')' : ''}</button></div>` : ''}
      ${open ? threadHtml(o.id, msgs, 'client', QUICK_CLIENT) : ''}
    </div>`;
}

function setClientPanel(id, p) { clientPanel[id] = p; paintMyOrders(true); }

async function clientCancel(orderId, reason) {
  const { data, error } = await client.rpc('cancel_order', { p_order: orderId, p_reason: reason });
  if (error) { toast(String(error.message || '').includes('trop_tard') ? 'Le livreur est déjà en route : appelez-le directement.' : "L'annulation n'a pas pu être envoyée. Réessayez."); return; }
  clientPanel[orderId] = '';
  toast(data === 'requested' ? "Demande envoyée au restaurant." : 'Commande annulée.');
  await loadMyOrders(); paintMyOrders(true);
}

async function confirmReceived(orderId) {
  const { error } = await client.rpc('client_confirm_delivery', { p_order: orderId });
  if (error) { toast("Confirmation impossible pour le moment. Réessayez."); return; }
  toast('Merci ! Bon appétit.');
  if (document.getElementById('view-tracking').style.display !== 'none') { show('orders'); await renderOrders(); }
  else { await loadMyOrders(); paintMyOrders(true); }
  const o = myOrders.find(x => x.id === orderId);
  if (o && o.status === 'Livrée') setTimeout(() => maybeAskReview(o), 600);
}

// ---------- Stories des restaurants ----------
let liveStories = [];
let storyGroups = [];
let sv = null;
function storySeen() { try { return new Set(JSON.parse(localStorage.getItem('dbf-story-seen') || '[]')); } catch (e) { return new Set(); } }
function markStorySeen(id) { try { const s = storySeen(); s.add(id); localStorage.setItem('dbf-story-seen', JSON.stringify([...s].slice(-400))); } catch (e) {} }
function viewerKey() { try { let k = localStorage.getItem('dbf-viewer'); if (!k) { k = crypto.randomUUID(); localStorage.setItem('dbf-viewer', k); } return k; } catch (e) { return 'anon-' + Math.random().toString(36).slice(2); } }

async function loadStories() {
  const { data } = await client.from('restaurant_stories').select('*').gt('expires_at', new Date().toISOString()).order('created_at');
  liveStories = (data || []).filter(s => restaurants.some(r => r.id === s.restaurant_id));
  const byR = {};
  liveStories.forEach(s => { (byR[s.restaurant_id] = byR[s.restaurant_id] || []).push(s); });
  const seen = storySeen();
  storyGroups = Object.keys(byR).map(rid => ({ rid, stories: byR[rid], allSeen: byR[rid].every(s => seen.has(s.id)), latest: byR[rid][byR[rid].length - 1].created_at }))
    .sort((a, b) => (a.allSeen - b.allSeen) || (new Date(b.latest) - new Date(a.latest)));
}

function storiesRailHtml() {
  if (!storyGroups.length) return '';
  return `<div class="st-rail" role="list" aria-label="Stories des restaurants">${storyGroups.map((g, i) => {
    const r = restaurants.find(x => x.id === g.rid) || {};
    const s0 = g.stories[g.stories.length - 1];
    return `<button type="button" class="st-item" role="listitem" onclick="openStories(${i})"><span class="st-ring ${g.allSeen ? 'seen' : ''}"><img src="${escHtml(s0.image_url)}" alt="" loading="lazy" /></span><span class="st-name">${escHtml(r.name || '')}</span></button>`;
  }).join('')}</div>`;
}

function refreshStoryRail() {
  const el = document.getElementById('st-rail-slot');
  if (el) el.innerHTML = storiesRailHtml();
}

function openStories(groupIndex) {
  const g = storyGroups[groupIndex];
  if (!g) return;
  const seen = storySeen();
  let start = g.stories.findIndex(s => !seen.has(s.id));
  if (start < 0) start = 0;
  sv = { g: groupIndex, i: start, timer: null, startedAt: 0, remaining: 5000, paused: false };
  let ov = document.getElementById('story-viewer');
  if (!ov) {
    ov = document.createElement('div');
    ov.id = 'story-viewer';
    ov.innerHTML = `<img id="sv-bg" alt="" aria-hidden="true" /><div class="sv-bars" id="sv-bars"></div><div class="sv-head"><span class="sv-rest" id="sv-rest"></span><span class="sv-time" id="sv-time"></span><button type="button" class="sv-close" aria-label="Fermer" onclick="closeStories()">Fermer</button></div><img id="sv-img" alt="" /><div class="sv-shade"></div><div class="sv-zone prev" id="sv-prev"></div><div class="sv-zone next" id="sv-next"></div><div class="sv-foot"><div class="sv-cap" id="sv-cap"></div><button type="button" class="sv-order" id="sv-order">Commander</button></div>`;
    document.body.appendChild(ov);
    let y0 = null, x0 = null;
    ov.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; pauseStory(); }, { passive: true });
    ov.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      if (y0 !== null && t.clientY - y0 > 90 && Math.abs(t.clientX - x0) < 80) { closeStories(); y0 = null; return; }
      y0 = null; resumeStory();
    }, { passive: true });
    document.getElementById('sv-prev').addEventListener('click', () => stepStory(-1));
    document.getElementById('sv-next').addEventListener('click', () => stepStory(1));
    document.getElementById('sv-order').addEventListener('click', orderFromStory);
    document.addEventListener('keydown', e => { if (!sv || document.getElementById('story-viewer').style.display === 'none') return; if (e.key === 'Escape') closeStories(); if (e.key === 'ArrowRight') stepStory(1); if (e.key === 'ArrowLeft') stepStory(-1); });
  }
  ov.style.display = 'block';
  document.body.style.overflow = 'hidden';
  showStory();
}

function showStory() {
  if (!sv) return;
  const g = storyGroups[sv.g];
  const s = g.stories[sv.i];
  const r = restaurants.find(x => x.id === g.rid) || {};
  document.getElementById('sv-img').src = s.image_url;
  document.getElementById('sv-bg').src = s.image_url;
  document.getElementById('sv-rest').textContent = r.name || '';
  document.getElementById('sv-time').textContent = timeAgo(s.created_at);
  document.getElementById('sv-cap').textContent = s.caption || '';
  const dish = s.menu_item_id ? (allDishPhotos.find(d => d.id === s.menu_item_id) || null) : null;
  document.getElementById('sv-order').textContent = isRestaurantOpen(r) ? (s.menu_item_id ? 'Commander ce plat' : 'Voir le menu') : 'Voir le menu (fermé)';
  document.getElementById('sv-bars').innerHTML = g.stories.map((x, k) => `<span class="${k < sv.i ? 'done' : ''}"><i class="${k === sv.i ? 'run' : ''}"></i></span>`).join('');
  markStorySeen(s.id);
  client.rpc('record_story_view', { p_story: s.id, p_viewer: viewerKey() }).then(() => {}, () => {});
  clearTimeout(sv.timer);
  sv.remaining = 5000; sv.startedAt = Date.now(); sv.paused = false;
  document.getElementById('story-viewer').classList.remove('paused');
  sv.timer = setTimeout(() => stepStory(1), 5000);
}

function pauseStory() { if (!sv || sv.paused) return; sv.paused = true; clearTimeout(sv.timer); sv.remaining = Math.max(300, sv.remaining - (Date.now() - sv.startedAt)); document.getElementById('story-viewer').classList.add('paused'); }
function resumeStory() { if (!sv || !sv.paused) return; sv.paused = false; sv.startedAt = Date.now(); document.getElementById('story-viewer').classList.remove('paused'); sv.timer = setTimeout(() => stepStory(1), sv.remaining); }

function stepStory(d) {
  if (!sv) return;
  const g = storyGroups[sv.g];
  const ni = sv.i + d;
  if (ni >= 0 && ni < g.stories.length) { sv.i = ni; showStory(); return; }
  const ng = sv.g + (d > 0 ? 1 : -1);
  if (ng >= 0 && ng < storyGroups.length) { sv.g = ng; sv.i = d > 0 ? 0 : storyGroups[ng].stories.length - 1; showStory(); return; }
  if (d > 0) closeStories(); else showStory();
}

function closeStories() {
  if (sv) clearTimeout(sv.timer);
  sv = null;
  const ov = document.getElementById('story-viewer');
  if (ov) ov.style.display = 'none';
  document.body.style.overflow = '';
  loadStories().then(refreshStoryRail);
}

async function orderFromStory() {
  if (!sv) return;
  const g = storyGroups[sv.g];
  const s = g.stories[sv.i];
  closeStories();
  await openRestaurant(g.rid);
  if (s.menu_item_id && isRestaurantOpen(currentRestaurant) && menuItems.some(m => m.id === s.menu_item_id)) addItem(s.menu_item_id);
}


bindThreadEvents((toggleOnly) => { if (toggleOnly) paintMyOrders(true); else loadMyOrders().then(() => paintMyOrders(true)); });
// ---------- Avis et notes des restaurants ----------
let reviewTarget = null;
let selectedRating = 0;
let reviewTags = new Set();
const RATING_LABELS = ['', 'Très décevant', 'Décevant', 'Correct', 'Bon', 'Excellent'];
const TAGS_GOOD = ['Délicieux', 'Portion généreuse', 'Bien emballé', 'Livraison rapide', 'Bon rapport qualité-prix'];
const TAGS_BAD = ['Froid à l\'arrivée', 'Trop long', 'Portion petite', 'Commande incomplète', 'Trop épicé', 'Trop gras'];
const STAR_PATH = 'M12 2.6l2.9 6.1 6.6.8-4.9 4.5 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.5 6.6-.8z';

function starsHtml(value, size) {
  const v = Math.max(0, Math.min(5, Number(value) || 0));
  let out = '';
  for (let i = 1; i <= 5; i++) {
    const fill = Math.max(0, Math.min(1, v - (i - 1)));
    const gid = 'sg' + Math.random().toString(36).slice(2, 8);
    out += `<svg class="st" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><defs><linearGradient id="${gid}"><stop offset="${fill * 100}%" stop-color="var(--mango)"/><stop offset="${fill * 100}%" stop-color="#3A3A3A"/></linearGradient></defs><path d="${STAR_PATH}" fill="url(#${gid})"/></svg>`;
  }
  return `<span class="stars-row" aria-label="${v.toFixed(1)} sur 5">${out}</span>`;
}

function reviewAreaHtml(o, r) {
  const mine = myReviewMap[o.id];
  const payload = JSON.stringify({ id: o.id, restaurant_id: o.restaurant_id, rname: (r ? r.name : '') }).replace(/'/g, '&apos;');
  if (mine) {
    const canEdit = minutesSince(mine.created_at) < 72 * 60;
    return `<div class="my-review">${starsHtml(mine.rating, 16)}<span>Votre avis${mine.comment ? ' : « ' + escHtml(mine.comment.slice(0, 80)) + (mine.comment.length > 80 ? '…' : '') + ' »' : ''}</span>${canEdit ? `<button class="link-btn2" onclick='openReview(${payload})'>Modifier</button>` : ''}</div>`;
  }
  if (minutesSince(o.delivered_at || o.created_at) > 30 * 24 * 60) return '';
  return `<div class="rate-cta"><div class="rate-cta-t">Comment était votre commande ?</div><div class="rate-cta-stars">${[1,2,3,4,5].map(n => `<button type="button" aria-label="${n} étoile${n > 1 ? 's' : ''}" onclick='openReview(${payload}, ${n})'><svg viewBox="0 0 24 24" width="30" height="30"><path d="${STAR_PATH}"/></svg></button>`).join('')}</div><div class="rate-cta-s">Votre note aide les autres clients à bien choisir.</div></div>`;
}

function openReview(order, preset) {
  reviewTarget = order;
  const mine = myReviewMap[order.id];
  selectedRating = preset || (mine ? mine.rating : 0);
  reviewTags = new Set();
  closeReview();
  const modal = document.createElement('div');
  modal.id = 'review-modal';
  modal.className = 'rv-modal';
  modal.innerHTML = `
    <div class="rv-sheet" role="dialog" aria-label="Donner mon avis">
      <div class="rv-k">VOTRE AVIS</div>
      <div class="display rv-title">${escHtml(order.rname || 'Ce restaurant')}</div>
      <div class="rv-picker" id="star-picker">${[1,2,3,4,5].map(n => `<button type="button" class="rv-star" data-n="${n}" aria-label="${n} étoile${n > 1 ? 's' : ''}" onclick="setRating(${n})"><svg viewBox="0 0 24 24" width="40" height="40"><path d="${STAR_PATH}"/></svg></button>`).join('')}</div>
      <div class="rv-label" id="rv-label">Touchez une étoile</div>
      <div class="rv-tags" id="rv-tags"></div>
      <textarea id="review-comment" maxlength="400" rows="3" placeholder="Racontez en quelques mots (facultatif)">${mine && mine.comment ? escHtml(mine.comment) : ''}</textarea>
      <div class="rv-note">Votre avis sera visible par tous les clients, avec votre prénom.</div>
      <button class="btn-primary" id="rv-send" onclick="submitReview()">Publier mon avis</button>
      <button class="btn-secondary" style="margin-top:8px;" onclick="closeReview()">Plus tard</button>
    </div>`;
  modal.addEventListener('click', (e) => { if (e.target === modal) closeReview(); });
  document.body.appendChild(modal);
  setRating(selectedRating);
}

function setRating(n) {
  selectedRating = n;
  document.querySelectorAll('#star-picker .rv-star').forEach(s => s.classList.toggle('filled', Number(s.dataset.n) <= n));
  const lab = document.getElementById('rv-label');
  if (lab) lab.textContent = n ? RATING_LABELS[n] : 'Touchez une étoile';
  const tagsEl = document.getElementById('rv-tags');
  if (tagsEl) {
    const list = !n ? [] : (n >= 4 ? TAGS_GOOD : (n <= 2 ? TAGS_BAD : TAGS_GOOD.slice(0, 2).concat(TAGS_BAD.slice(0, 3))));
    reviewTags.forEach(t => { if (!list.includes(t)) reviewTags.delete(t); });
    tagsEl.innerHTML = list.map(t => `<button type="button" class="rv-tag ${reviewTags.has(t) ? 'on' : ''}" onclick="toggleReviewTag(this, ${JSON.stringify(t).replace(/"/g, '&quot;')})">${escHtml(t)}</button>`).join('');
  }
}

function toggleReviewTag(btn, t) {
  if (reviewTags.has(t)) reviewTags.delete(t); else reviewTags.add(t);
  btn.classList.toggle('on', reviewTags.has(t));
}

function closeReview() {
  const m = document.getElementById('review-modal');
  if (m) m.remove();
}

async function submitReview() {
  if (!selectedRating) { toast('Choisissez une note de 1 à 5 étoiles'); return; }
  const free = (document.getElementById('review-comment').value || '').trim();
  const comment = [Array.from(reviewTags).join(', '), free].filter(Boolean).join(reviewTags.size && free ? '. ' : '').slice(0, 400);
  const btn = document.getElementById('rv-send');
  if (btn) { btn.disabled = true; btn.textContent = 'Envoi…'; }
  const { error } = await client.rpc('submit_review', { p_order: reviewTarget.id, p_rating: selectedRating, p_comment: comment || null });
  if (error) {
    if (btn) { btn.disabled = false; btn.textContent = 'Publier mon avis'; }
    const m = String(error.message || '');
    toast(m.includes('modification_impossible') ? 'Un avis ne peut plus être modifié après 3 jours.' : m.includes('non_livree') ? 'Vous pourrez noter dès que la commande sera livrée.' : "Envoi impossible pour le moment. Réessayez.");
    return;
  }
  try { const s = new Set(JSON.parse(localStorage.getItem('dbf-review-asked') || '[]')); s.add(reviewTarget.id); localStorage.setItem('dbf-review-asked', JSON.stringify([...s].slice(-200))); } catch (e) {}
  closeReview();
  toast('Merci, votre avis est publié.');
  delete restaurantReviewsCache[reviewTarget.restaurant_id];
  await loadMyOrders();
  paintMyOrders(true);
  loadRatings();
}

// Invitation automatique à noter une commande livrée (une seule fois par commande)
function maybeAskReview(o) {
  if (!o || o.status !== 'Livrée' || myReviewed.has(o.id)) return;
  let asked;
  try { asked = new Set(JSON.parse(localStorage.getItem('dbf-review-asked') || '[]')); } catch (e) { asked = new Set(); }
  if (asked.has(o.id)) return;
  asked.add(o.id);
  try { localStorage.setItem('dbf-review-asked', JSON.stringify([...asked].slice(-200))); } catch (e) {}
  const r = restaurants.find(x => x.id === o.restaurant_id);
  openReview({ id: o.id, restaurant_id: o.restaurant_id, rname: r ? r.name : '' });
}

// Avis affichés sur la page du restaurant
const restaurantReviewsCache = {};
async function loadRestaurantReviews(id) {
  if (restaurantReviewsCache[id]) return restaurantReviewsCache[id];
  const { data } = await client.from('reviews').select('id, rating, comment, author_name, created_at, reply, reply_at').eq('restaurant_id', id).order('created_at', { ascending: false }).limit(60);
  restaurantReviewsCache[id] = data || [];
  return restaurantReviewsCache[id];
}

function reviewDate(ts) { return new Date(ts).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' }); }

async function renderRestaurantRating() {
  const r = currentRestaurant;
  const el = document.getElementById('rest-rating');
  if (!el || !r) return;
  const list = await loadRestaurantReviews(r.id);
  if (!currentRestaurant || currentRestaurant.id !== r.id) return;
  if (!list.length) {
    el.innerHTML = `<div class="rr-empty">${starsHtml(0, 15)}<span>Pas encore d'avis. Soyez le premier à noter ce restaurant après votre commande.</span></div>`;
    return;
  }
  const avg = list.reduce((a, b) => a + b.rating, 0) / list.length;
  const dist = [5, 4, 3, 2, 1].map(n => ({ n, c: list.filter(x => x.rating === n).length }));
  const open = el.dataset.open === '1';
  el.innerHTML = `
    <button type="button" class="rr-sum" onclick="toggleRestReviews()">
      <span class="rr-avg">${avg.toFixed(1).replace('.', ',')}</span>
      <span class="rr-mid">${starsHtml(avg, 16)}<span class="rr-count">${list.length} avis client${list.length > 1 ? 's' : ''}</span></span>
      <span class="rr-more">${open ? 'Masquer' : 'Lire les avis'}</span>
    </button>
    ${open ? `<div class="rr-panel">
      <div class="rr-dist">${dist.map(d => `<div class="rr-bar"><span>${d.n}</span><i><b style="width:${Math.round(d.c / list.length * 100)}%"></b></i><span>${d.c}</span></div>`).join('')}</div>
      ${list.map(v => `<div class="rv-item">
        <div class="rv-top">${starsHtml(v.rating, 13)}<span class="rv-who">${escHtml(v.author_name || 'Client')}</span><span class="rv-when">${reviewDate(v.created_at)}</span></div>
        ${v.comment ? `<div class="rv-text">${escHtml(v.comment)}</div>` : ''}
        ${v.reply ? `<div class="rv-reply"><b>Réponse du restaurant</b>${escHtml(v.reply)}</div>` : ''}
      </div>`).join('')}
    </div>` : ''}`;
}

function toggleRestReviews() {
  const el = document.getElementById('rest-rating');
  if (!el) return;
  el.dataset.open = el.dataset.open === '1' ? '' : '1';
  renderRestaurantRating();
}

async function loadRatings() {
  const { data: revs } = await client.from('reviews').select('restaurant_id, rating');
  Object.keys(restaurantRatingMap).forEach(k => delete restaurantRatingMap[k]);
  const grouped = {};
  (revs || []).forEach(r => { (grouped[r.restaurant_id] = grouped[r.restaurant_id] || []).push(r.rating); });
  Object.keys(grouped).forEach(id => {
    const arr = grouped[id];
    restaurantRatingMap[id] = { avg: (arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1), count: arr.length };
  });
}

let trackingTimer = null;
let trackingMap = null;

const ORDER_STEPS = ['Reçue', 'En préparation', 'Prête', 'En livraison', 'Livrée'];
const ORDER_STEP_LABELS = { 'Reçue': 'Commande reçue', 'En préparation': 'En préparation', 'Prête': 'Prête à partir', 'En livraison': 'En route vers vous', 'Livrée': 'Livrée' };

function timelineHtml(status) {
  const idx = ORDER_STEPS.indexOf(status);
  return `
    <div class="timeline">
      ${ORDER_STEPS.map((s, i) => {
        const done = i <= idx;
        const isLast = i === ORDER_STEPS.length - 1;
        return `
          <div class="timeline-step">
            <div class="timeline-dot-col">
              <div class="timeline-dot ${done ? 'done' : ''}"></div>
              ${!isLast ? `<div class="timeline-bar ${i < idx ? 'done' : ''}"></div>` : ''}
            </div>
            <div class="timeline-label ${done ? 'done' : ''}">${ORDER_STEP_LABELS[s]}</div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

async function updateTrackingView(orderId) {
  const { data: o, error } = await client.from('orders').select('*, drivers(name, phone, face_photo_url, current_lat, current_lng, location_updated_at)').eq('id', orderId).maybeSingle();
  if (error || !o) return;

  const statusEl = document.getElementById('track-status');
  const slotEl = document.getElementById('track-driver-slot');
  const timelineEl = document.getElementById('track-timeline');
  if (!statusEl) return; // vue quittée entre-temps

  timelineEl.innerHTML = timelineHtml(o.status);
  statusEl.textContent = o.status === 'En livraison' && !o.collected_at ? 'Le livreur récupère votre commande au restaurant' : (ORDER_STEP_LABELS[o.status] || o.status);

  if (o.status === 'Livrée') {
    statusEl.textContent = "Commande livrée";
    if (trackingTimer) { clearInterval(trackingTimer); trackingTimer = null; }
  }

  const d = o.drivers;
  if (d) {
    slotEl.innerHTML = `
      <div class="track-driver-box">
        <div style="display:flex; align-items:center; gap:12px;">
          ${driverAvatar(d, 52)}
          <div>
            <div style="font-weight:700; font-size:14.5px;">${escHtml(d.name)}</div>
            <div style="font-size:12px; color:var(--creamDim);">Votre livreur</div>
          </div>
        </div>
        <a href="tel:${d.phone}" class="btn-call-track">Appeler</a>
      </div>
    `;
  } else {
    slotEl.innerHTML = '';
  }

  const noteEl = document.getElementById('track-note');
  const actEl = document.getElementById('track-actions');
  if (actEl) actEl.innerHTML = o.status === 'En livraison' ? `<button class="btn-primary" onclick="confirmReceived('${o.id}')">J'ai reçu ma commande</button>` : '';
  const fresh = d && d.current_lat && d.location_updated_at && minutesSince(d.location_updated_at) <= 10;
  if (!d || o.status !== 'En livraison' || !fresh) {
    if (noteEl) noteEl.innerHTML = o.status === 'Livrée' ? '' : `<div class="track-note">${!d ? "Un livreur va être désigné. Vous serez prévenu dès qu'il part." : (o.status !== 'En livraison' ? '' : "La position du livreur n'est pas disponible pour le moment (réseau ou GPS de son téléphone). Vous pouvez l'appeler avec le bouton ci-dessus.")}</div>`;
    const mapBox = document.getElementById('tracking-map');
    if (mapBox) mapBox.style.display = 'none';
    return;
  } else if (noteEl) {
    noteEl.innerHTML = `<div class="track-note">${o.collected_at ? '' : 'Votre livreur passe d\'abord récupérer votre commande au restaurant, puis il vient chez vous. '}Position du livreur mise à jour ${timeAgo(d.location_updated_at)}.</div>`;
  }

  const mapEl = document.getElementById('tracking-map');
  mapEl.style.display = 'block';
  if (!trackingMap) {
    trackingMap = L.map(mapEl).setView([d.current_lat, d.current_lng], 16);
    equipMap(trackingMap);
    trackingMarker = L.marker([d.current_lat, d.current_lng]).addTo(trackingMap).bindPopup('Livreur');

    if (o.location && o.location.type === 'gps') {
      trackingDestMarker = L.marker([o.location.lat, o.location.lng]).addTo(trackingMap).bindPopup('Vous');
      trackingMap.fitBounds([[d.current_lat, d.current_lng], [o.location.lat, o.location.lng]], { padding: [30,30] });
    }
  } else {
    trackingMarker.setLatLng([d.current_lat, d.current_lng]);
    trackingMap.panTo([d.current_lat, d.current_lng]);
  }
}

// ---------- Diaporama d'accueil : les plats de tous les restaurants ----------
const Showcase = (() => {
  const DUR = 5600;
  let slides = [];
  let idx = 0;
  let timer = null;
  let remaining = DUR;
  let startedAt = 0;
  let paused = false;
  let held = false;
  let root = null;
  let touchX = null, touchY = null, swiped = false;
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function shuffle(a) {
    const b = a.slice();
    for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
    return b;
  }

  // Alternance équitable : un plat de chaque restaurant, puis on recommence
  function prepare() {
    const byRest = {};
    allDishPhotos.forEach(p => {
      if (!restaurants.some(r => r.id === p.restaurant_id)) return;
      (byRest[p.restaurant_id] = byRest[p.restaurant_id] || []).push(p);
    });
    let ids = shuffle(Object.keys(byRest));
    const isOpen = id => { const r = restaurants.find(x => x.id === id); return r ? isRestaurantOpen(r) : false; };
    ids = ids.filter(isOpen).concat(ids.filter(id => !isOpen(id)));
    ids.forEach(id => { byRest[id] = shuffle(byRest[id]).slice(0, 4); });
    const out = [];
    for (let round = 0; round < 4; round++) ids.forEach(id => { if (byRest[id][round]) out.push(byRest[id][round]); });
    slides = out.slice(0, 16);
    idx = 0;
  }

  function slideHtml(p, i) {
    const src = i < 2 ? `src="${escHtml(p.photo_url)}"` : `data-src="${escHtml(p.photo_url)}"`;
    return `<figure class="sc-slide ${i % 2 ? 'kb-b' : 'kb-a'}${i === 0 ? ' is-active' : ''}" data-i="${i}" aria-hidden="${i === 0 ? 'false' : 'true'}"><img ${src} alt="${escHtml(p.name)}" decoding="async" draggable="false" /></figure>`;
  }

  function html() {
    if (slides.length === 0) {
      return `<div class="showcase" style="cursor:default; background:url('images/hero-food.jpg') center/cover;"><div class="sc-shade"></div></div>`;
    }
    const multi = slides.length > 1;
    return `
      <div class="showcase" id="showcase" tabindex="0" role="region" aria-roledescription="carrousel" aria-label="Plats des restaurants">
        ${slides.map(slideHtml).join('')}
        <div class="sc-shade"></div>
        ${multi ? `<div class="sc-bars">${slides.map(() => '<span><i></i></span>').join('')}</div>` : ''}
        <div class="sc-rest" id="sc-rest"></div>
        <div class="sc-info" id="sc-info" aria-live="polite"></div>
        ${multi ? `
        <button class="sc-arrow prev" type="button" aria-label="Plat précédent" data-nav="-1"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="sc-arrow next" type="button" aria-label="Plat suivant" data-nav="1"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>` : ''}
      </div>`;
  }

  function restOf(p) { return restaurants.find(r => r.id === p.restaurant_id) || null; }

  function paintInfo(animate) {
    const p = slides[idx];
    if (!p || !root) return;
    const r = restOf(p);
    const restEl = root.querySelector('#sc-rest');
    const infoEl = root.querySelector('#sc-info');
    const open = r ? isRestaurantOpen(r) : true;
    restEl.innerHTML = `<span class="sc-rest-dot" style="background:${escHtml((r && r.accent) || '#F5C04A')}"></span><span class="sc-rest-name">${escHtml(r ? r.name : '')}</span>${open ? '' : `<span class="sc-rest-state">Fermé</span>`}`;
    infoEl.innerHTML = `
      <div class="sc-name">${escHtml(p.name)}</div>
      <div class="sc-row">
        <div class="sc-price">${Number(p.price || 0).toLocaleString('fr-FR')}<small>FCFA</small></div>
        <span class="sc-go">Voir le menu<b><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></b></span>
      </div>`;
    if (animate && !reduce) {
      [infoEl, restEl].forEach(el => { el.classList.remove('swap'); void el.offsetWidth; el.classList.add('swap'); });
    }
  }

  function paintBars() {
    if (!root) return;
    root.style.setProperty('--sc-dur', DUR + 'ms');
    root.querySelectorAll('.sc-bars span').forEach((b, i) => {
      b.classList.remove('run');
      b.classList.toggle('done', i < idx);
    });
    const cur = root.querySelectorAll('.sc-bars span')[idx];
    if (cur) { void cur.offsetWidth; cur.classList.add('run'); }
  }

  function ensureSrc(i) {
    if (!root) return Promise.resolve();
    const img = root.querySelector(`.sc-slide[data-i="${i}"] img`);
    if (!img) return Promise.resolve();
    if (img.dataset.src) { img.src = img.dataset.src; delete img.dataset.src; }
    if (img.complete && img.naturalWidth) return Promise.resolve();
    return new Promise(res => {
      const done = () => { img.removeEventListener('load', done); img.removeEventListener('error', done); res(); };
      img.addEventListener('load', done); img.addEventListener('error', done);
      setTimeout(done, 4000);
    });
  }

  function visible() {
    const v = document.getElementById('view-list');
    return root && document.body.contains(root) && document.visibilityState === 'visible' && v && v.style.display !== 'none';
  }

  function schedule(ms) {
    clearTimeout(timer);
    remaining = ms;
    startedAt = Date.now();
    timer = setTimeout(() => {
      if (!visible() || held) { schedule(DUR); paintBars(); return; }
      go(idx + 1, true);
    }, ms);
  }

  async function go(next, auto) {
    if (!root || slides.length < 2) return;
    next = (next + slides.length) % slides.length;
    await ensureSrc(next);
    if (!root) return;
    const slidesEls = root.querySelectorAll('.sc-slide');
    const prev = slidesEls[idx];
    const nxt = slidesEls[next];
    if (!nxt) return;
    if (prev && prev !== nxt) { prev.classList.remove('is-active'); prev.setAttribute('aria-hidden', 'true'); }
    nxt.classList.remove('is-active'); void nxt.offsetWidth;
    nxt.classList.add('is-active'); nxt.setAttribute('aria-hidden', 'false');
    idx = next;
    if (idx === 0) root.querySelectorAll('.sc-bars span').forEach(b => b.classList.remove('done'));
    paintInfo(true);
    paintBars();
    ensureSrc((idx + 1) % slides.length);
    paused = false; root.classList.remove('is-paused');
    schedule(DUR);
  }

  function pause() {
    if (paused || !root) return;
    paused = true;
    root.classList.add('is-paused');
    clearTimeout(timer);
    remaining = Math.max(400, remaining - (Date.now() - startedAt));
  }
  function resume() {
    if (!paused || !root) return;
    paused = false;
    root.classList.remove('is-paused');
    schedule(remaining);
  }

  function openCurrent() {
    const p = slides[idx];
    if (p) openRestaurant(p.restaurant_id);
  }

  function mount() {
    clearTimeout(timer);
    root = document.getElementById('showcase');
    if (!root) return;
    paused = false; held = false;
    paintInfo(false);
    if (slides.length < 2) { root.addEventListener('click', openCurrent); return; }
    paintBars();
    ensureSrc(1);
    schedule(DUR);

    root.addEventListener('touchstart', (e) => {
      const t = e.touches[0]; touchX = t.clientX; touchY = t.clientY; swiped = false; held = true; pause();
    }, { passive: true });
    root.addEventListener('touchmove', (e) => {
      if (touchX === null) return;
      const t = e.touches[0];
      if (Math.abs(t.clientX - touchX) > 12 && Math.abs(t.clientX - touchX) > Math.abs(t.clientY - touchY)) swiped = true;
    }, { passive: true });
    root.addEventListener('touchend', (e) => {
      held = false;
      const t = e.changedTouches[0];
      const dx = touchX === null ? 0 : t.clientX - touchX;
      const dy = touchY === null ? 0 : t.clientY - touchY;
      touchX = touchY = null;
      if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) { swiped = true; go(idx + (dx < 0 ? 1 : -1)); return; }
      resume();
    }, { passive: true });
    root.addEventListener('touchcancel', () => { held = false; touchX = touchY = null; resume(); }, { passive: true });
    root.addEventListener('click', (e) => {
      const nav = e.target.closest('[data-nav]');
      if (nav) { e.stopPropagation(); go(idx + Number(nav.dataset.nav)); return; }
      if (swiped) { swiped = false; return; }
      openCurrent();
    });
    root.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') pause(); });
    root.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') resume(); });
    root.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(idx + 1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
      else if (e.key === 'Enter') { e.preventDefault(); openCurrent(); }
    });
  }

  document.addEventListener('visibilitychange', () => {
    if (!root || slides.length < 2) return;
    if (document.visibilityState === 'visible') { paintBars(); schedule(DUR); }
    else clearTimeout(timer);
  });

  return { prepare, html, mount, go, count: () => slides.length, current: () => idx, list: () => slides.slice() };
})();

        </button>
      `;
  }).join('');
}

function filterRestaurants() {
  const q = document.getElementById('restaurant-search').value.trim().toLowerCase();
  let filtered = restaurants;
  if (selectedCategory) {
    filtered = filtered.filter(r => (r.category || '').toLowerCase().includes(selectedCategory));
  }
  if (q) {
    filtered = filtered.filter(r =>
      (r.name || '').toLowerCase().includes(q) || (r.category || '').toLowerCase().includes(q) || (r.tagline || '').toLowerCase().includes(q)
    );
  }
  document.getElementById('restaurant-list').innerHTML = restaurantCardsHtml(filtered);
}

async function openRestaurant(id) {
  currentRestaurant = restaurants.find(r => r.id === id);
  cart = {};
  updateHeaderCartBadge();
  const { data } = await client.from('menu_items').select('*').eq('restaurant_id', id);
  menuItems = data || [];
  renderMenu();
  show('menu');
}

function renderMenu() {
  const r = currentRestaurant;
  const el = document.getElementById('view-menu');
  const open = isRestaurantOpen(r);
  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="setActiveNav('home'); show('list')">← Tous les restaurants</button>
      <div class="display" style="font-size:28px; color:${r.accent}">${r.name}</div>
      <div style="font-size:13px; color:var(--creamDim); margin-bottom:8px;">${r.tagline || ''}</div>
      <div id="rest-rating" class="rest-rating"></div>
      <div class="fee-line"><strong>${money(DELIVERY_FEE)}</strong><span>de frais de livraison, ajoutés au prix de vos plats et payés à la réception.</span></div>
      ${!open ? (r.accepting_orders === false ? `<div class="closed-banner">Ce restaurant a mis les commandes en pause pour le moment. Vous pouvez consulter le menu et revenir un peu plus tard.</div>` : `<div class="closed-banner">Ce restaurant est actuellement fermé. Horaires : ${formatHM(r.opens_at)} – ${formatHM(r.closes_at)}. Vous pouvez consulter le menu, mais la commande n'est pas possible pour le moment.</div>`) : ''}
      <div id="menu-items"></div>
    </div>
    <div id="cart-bar"></div>
  `;
  renderMenuItems();
  renderRestaurantRating();
}

function openPhotoViewer(url, name) {
  let v = document.getElementById('photo-viewer');
  if (!v) {
    v = document.createElement('div');
    v.id = 'photo-viewer';
    v.style.cssText = 'position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.94); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;';
    v.onclick = () => { v.style.display = 'none'; };
    document.body.appendChild(v);
  }
  v.innerHTML = `<img src="${url}" alt="${name}" style="max-width:100%; max-height:78vh; border-radius:18px; object-fit:contain;" /><div style="margin-top:16px; color:#fff; font-weight:700; font-size:18px;">${name}</div><div style="margin-top:6px; color:#8F8F8F; font-size:12px;">Touchez pour fermer</div>`;
  v.style.display = 'flex';
}

function renderMenuItems() {
  const r = currentRestaurant;
  const open = isRestaurantOpen(r);
  document.getElementById('menu-items').innerHTML = menuItems.map(item => {
    const inCart = cart[item.id];
    const control = !open ? `<button class="qty-btn" style="background:var(--line); color:var(--creamDim); cursor:not-allowed;" disabled>+</button>` : !inCart ? `
          <button class="qty-btn" style="background:${r.accent}; color:#080808;" onclick="addItem('${item.id}')">+</button>
        ` : `
          <div style="display:flex; align-items:center; gap:8px;">
            <button class="qty-btn" style="background:var(--bg); border:1px solid var(--line); color:var(--cream);" onclick="removeItem('${item.id}')">−</button>
            <span class="mono" style="min-width:14px; text-align:center;">${inCart.qty}</span>
            <button class="qty-btn" style="background:${r.accent}; color:#080808;" onclick="addItem('${item.id}')">+</button>
          </div>
        `;
    if (item.photo_url) {
      return `
      <div style="background:var(--surface); border:1px solid var(--line); border-radius:22px; overflow:hidden; margin-bottom:18px; box-shadow:0 10px 28px rgba(0,0,0,0.45);">
        <div style="position:relative; cursor:zoom-in;" onclick="openPhotoViewer('${item.photo_url}', ${JSON.stringify(item.name).replace(/"/g,'&quot;')})">
          <img src="${item.photo_url}" alt="${item.name}" loading="lazy" style="display:block; width:100%; aspect-ratio:4/3; object-fit:cover;" />
          <div style="position:absolute; left:0; right:0; bottom:0; height:90px; background:linear-gradient(180deg, rgba(8,8,8,0), rgba(8,8,8,0.78));"></div>
          <div class="mono" style="position:absolute; left:16px; bottom:12px; font-size:17px; font-weight:700; color:#fff; background:${r.accent}; color:#080808; padding:5px 12px; border-radius:20px;">${money(item.price)}</div>
        </div>
        <div style="display:flex; align-items:center; gap:12px; padding:16px;">
          <div style="flex:1; min-width:0;">
            <div style="font-weight:700; font-size:18px; letter-spacing:-0.3px;">${item.name}</div>
            ${item.description ? `<div style="font-size:13px; color:var(--creamDim); margin-top:4px; line-height:1.45;">${item.description}</div>` : ''}
          </div>
          ${control}
        </div>
      </div>`;
    }
    return `
      <div class="item">
        <div class="item-emoji avatar" style="background:${r.accent}26; color:${r.accent}; font-size:19px;">${initial(item.name)}</div>
        <div style="flex:1;">
          <div style="font-weight:600; font-size:15px;">${item.name}</div>
          <div style="font-size:12.5px; color:var(--creamDim); margin-top:2px;">${item.description || ''}</div>
          <div class="mono" style="font-size:13px; color:${r.accent}; margin-top:6px;">${money(item.price)}</div>
        </div>
        ${control}
      </div>
    `;
  }).join('');
  renderCartBar();
}

function addItem(id) {
  if (!isRestaurantOpen(currentRestaurant)) { toast(currentRestaurant && currentRestaurant.accepting_orders === false ? "Ce restaurant est en pause pour le moment." : "Ce restaurant est fermé pour le moment."); renderMenu(); return; }
  const item = menuItems.find(i => i.id === id);
  if (!item) return;
  const wasEmpty = cartCount() === 0;
  if (cart[id]) cart[id].qty++; else cart[id] = { ...item, qty: 1 };
  if (wasEmpty) showFeeNotice();
  renderMenuItems();
  updateHeaderCartBadge();
}
function removeItem(id) {
  if (!cart[id]) return;
  cart[id].qty--;
  if (cart[id].qty <= 0) delete cart[id];
  renderMenuItems();
  updateHeaderCartBadge();
}

function cartTotal() { return Object.values(cart).reduce((s,i) => s + i.qty * i.price, 0); }
function cartCount() { return Object.values(cart).reduce((s,i) => s + i.qty, 0); }
function orderTotal() { return cartTotal() + DELIVERY_FEE; }

let feeNoticeTimer = null;
function showFeeNotice() {
  const n = document.getElementById('fee-notice');
  if (!n) return;
  document.getElementById('fee-notice-amount').innerHTML = `${Number(DELIVERY_FEE).toLocaleString('fr-FR')}<small>F</small>`;
  n.classList.add('show');
  clearTimeout(feeNoticeTimer);
  feeNoticeTimer = setTimeout(hideFeeNotice, 6500);
}
function hideFeeNotice() {
  clearTimeout(feeNoticeTimer);
  const n = document.getElementById('fee-notice');
  if (n) n.classList.remove('show');
}

function updateHeaderCartBadge() {
  const badge = document.getElementById('header-cart-badge');
  if (!badge) return;
  const n = cartCount();
  badge.style.display = n > 0 ? 'flex' : 'none';
  badge.textContent = n;
}

function goToCart() {
  if (cartCount() > 0) { show('checkout'); renderCheckout(); }
  else { navTo('restaurants'); }
}

function renderCartBar() {
  const bar = document.getElementById('cart-bar');
  if (cartCount() === 0) { bar.innerHTML = ''; return; }
  const r = currentRestaurant;
  bar.innerHTML = `
    <div class="cart-bar">
      <button class="cart-btn" style="background:linear-gradient(135deg, ${r.accent}, ${r.accent}CC);" onclick="show('checkout'); renderCheckout();">
        <span>Voir le panier (${cartCount()})</span>
        <span class="cb-right"><span>${money(orderTotal())}</span><small>livraison ${money(DELIVERY_FEE)} incluse</small></span>
      </button>
    </div>
  `;
}

function renderCheckout() {
  const el = document.getElementById('view-checkout');

  if (!currentCustomer) {
    el.innerHTML = `
      <div class="section">
        <button class="btn-back" onclick="show('menu')">← Retour au menu</button>
        <div class="display" style="font-size:26px; margin-bottom:10px;">Un compte est nécessaire</div>
        <div style="font-size:14px; color:var(--creamDim); margin-bottom:20px;">Connectez-vous ou créez un compte pour valider votre commande.</div>
        <button class="btn-primary" onclick="openAccount()">Se connecter / Créer un compte</button>
      </div>
    `;
    return;
  }

  el.innerHTML = `
    <div class="section">
      <button class="btn-back" onclick="show('menu')">← Retour au menu</button>
      <div class="display" style="font-size:26px; margin-bottom:14px;">Votre commande</div>
      <div class="fee-line"><strong>${money(DELIVERY_FEE)}</strong><span>de frais de livraison s'ajoutent à vos plats. Vous réglez le total en espèces au livreur.</span></div>
      <div class="sum-box">
        ${Object.values(cart).map(i => `
          <div class="sum-line sum-item"><span>${i.qty}× ${escHtml(i.name)}</span><span>${money(i.qty*i.price)}</span></div>
        `).join('')}
        <div class="sum-line" style="border-top:1px solid var(--line); margin-top:8px; padding-top:9px;"><span>Sous-total des plats</span><span>${money(cartTotal())}</span></div>
        <div class="sum-line fee"><span>Livraison</span><span>${money(DELIVERY_FEE)}</span></div>
        <div class="sum-total"><span>Total à payer</span><span>${money(orderTotal())}</span></div>
      </div>

      <label>Nom</label>
      <input id="f-name" placeholder="Votre nom" value="${currentCustomer.name || ''}" />
      <label>Téléphone</label>
      <input id="f-phone" placeholder="07 00 00 00 00" value="${currentCustomer.phone || ''}" />

      <label>Position de livraison</label>
      <button type="button" class="gps-cta" id="btn-gps" onclick="useGPS()">Partager ma position GPS (recommandé)</button>
      <div class="gps-hint">Le livreur arrive directement chez vous, sans devoir vous appeler pour trouver le chemin.</div>
      <div id="loc-status" style="margin-bottom:10px;"></div>

      <label>Repère (optionnel)</label>
      <input id="f-address" placeholder="Ex: portail bleu, près de la pharmacie" />

      ${prefsHtml()}

      <button class="btn-primary" id="btn-order" onclick="placeOrder()">Commander pour ${money(orderTotal())}, payé à la livraison</button>
    </div>
  `;
}


// ---------- Préférences et allergies ----------
const PREF_TASTE = ['Sans piment', 'Peu pimenté', 'Bien pimenté', "Pas trop d'huile", 'Peu salé', 'Sans oignon', 'Sans ail', 'Sans cube', 'Sans mayonnaise', 'Sauce à part', 'Bien cuit'];
const PREF_DIET = ["Allergie à l'arachide", 'Allergie aux fruits de mer', 'Allergie au poisson', 'Allergie aux œufs', 'Allergie au lait', 'Allergie au gluten', 'Sans porc', 'Végétarien'];
const PREF_EXCLUSIVE = [['Sans piment', 'Peu pimenté', 'Bien pimenté']];
const PREFS_KEY = 'dbf-prefs';
let selectedPrefs = new Set();
let prefNotes = '';

function loadSavedPrefs() {
  try {
    const raw = JSON.parse(localStorage.getItem(PREFS_KEY) || 'null');
    if (raw && Array.isArray(raw.p)) {
      const known = new Set(PREF_TASTE.concat(PREF_DIET));
      selectedPrefs = new Set(raw.p.filter(x => known.has(x)));
      prefNotes = typeof raw.n === 'string' ? raw.n.slice(0, 200) : '';
    }
  } catch (e) {}
}
function savePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify({ p: [...selectedPrefs], n: prefNotes })); } catch (e) {}
}

function prefChip(label, isAllergy) {
  const on = selectedPrefs.has(label);
  return `<button type="button" class="chip${isAllergy ? ' allergy' : ''}" aria-pressed="${on}" data-pref="${escHtml(label)}">${escHtml(label)}</button>`;
}

function prefsHtml() {
  loadSavedPrefs();
  return `
    <div class="prefs" id="prefs">
      <div class="prefs-title">Préférences et allergies</div>
      <div class="prefs-help">Facultatif. Le restaurant les verra avec votre commande. Vos choix sont gardés pour la prochaine fois.</div>
      <div class="prefs-group">Goût et cuisson</div>
      <div class="chips">${PREF_TASTE.map(l => prefChip(l, false)).join('')}</div>
      <div class="prefs-group">Allergies et régime</div>
      <div class="chips">${PREF_DIET.map(l => prefChip(l, l.startsWith('Allergie'))).join('')}</div>
      <textarea id="f-notes" maxlength="200" placeholder="Autre précision : sauce à part, attiéké bien chaud, sans os…">${escHtml(prefNotes)}</textarea>
      <div class="prefs-count" id="f-notes-count">${prefNotes.length} / 200</div>
    </div>`;
}

document.addEventListener('click', (e) => {
  const chip = e.target.closest('#prefs .chip');
  if (!chip) return;
  const label = chip.dataset.pref;
  if (selectedPrefs.has(label)) {
    selectedPrefs.delete(label);
  } else {
    PREF_EXCLUSIVE.forEach(group => { if (group.includes(label)) group.forEach(g => selectedPrefs.delete(g)); });
    selectedPrefs.add(label);
  }
  document.querySelectorAll('#prefs .chip').forEach(c => c.setAttribute('aria-pressed', String(selectedPrefs.has(c.dataset.pref))));
  savePrefs();
});
document.addEventListener('input', (e) => {
  if (e.target && e.target.id === 'f-notes') {
    prefNotes = e.target.value.slice(0, 200);
    const c = document.getElementById('f-notes-count');
    if (c) c.textContent = prefNotes.length + ' / 200';
    savePrefs();
  }
});

function useGPS() {
  document.getElementById('loc-status').innerHTML = 'Recherche de votre position…';
  if (!navigator.geolocation) { toast("Géolocalisation non disponible sur cet appareil"); return; }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      location_ = { type: 'gps', lat: pos.coords.latitude, lng: pos.coords.longitude };
      document.getElementById('loc-status').innerHTML = `<div class="mono" style="font-size:11.5px; color:var(--palm);">GPS : ${location_.lat.toFixed(4)}, ${location_.lng.toFixed(4)}</div>`;
      document.getElementById('btn-gps').classList.add('active');
    },
    (err) => {
      document.getElementById('loc-status').innerHTML = `<div style="font-size:12px; color:#F0A99A; line-height:1.45;">${err && err.code === 1 ? (isIOS() ? "Position refusée. Sur iPhone : Réglages, puis Confidentialité et sécurité, puis Service de localisation, puis Safari : « Lorsque l'app est active ». Sinon, décrivez votre repère ci-dessous." : "Position refusée. Autorisez la position pour ce site, ou décrivez votre repère ci-dessous.") : "Position introuvable pour le moment. Décrivez votre repère ci-dessous."}</div>`;
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

async function placeOrder() {
  if (!currentCustomer) { openAccount(); return; }
  if (!isRestaurantOpen(currentRestaurant)) { toast("Ce restaurant est fermé pour le moment."); show('menu'); renderMenu(); return; }
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  const address = document.getElementById('f-address').value.trim();
  if (!name || !phone || !(location_ || address)) { toast("Complétez au moins le nom, le téléphone et une position"); return; }
  if (!location_ && address.length < 8) { toast("Sans GPS, décrivez précisément votre repère (quartier, rue, couleur du portail…)."); return; }

  const items = Object.values(cart).map(i => ({ itemId: i.id, name: i.name, price: i.price, qty: i.qty }));
  const total = orderTotal();
  const notesEl = document.getElementById('f-notes');
  const notes = (notesEl ? notesEl.value : prefNotes).trim().slice(0, 200);
  const preferences = PREF_TASTE.concat(PREF_DIET).filter(l => selectedPrefs.has(l));

  const orderId = crypto.randomUUID();
  const payload = {
    id: orderId,
    restaurant_id: currentRestaurant.id,
    customer_name: name,
    phone, address,
    location: location_,
    items, total,
    delivery_fee: DELIVERY_FEE,
    preferences,
    notes: notes || null,
    status: 'Reçue'
  };
  if (currentCustomer) payload.customer_id = currentCustomer.id;

  const btn = document.getElementById('btn-order');
  if (btn) { if (btn.disabled) return; btn.disabled = true; btn.style.opacity = '0.6'; }
  const { error } = await client.from('orders').insert(payload);

  if (error) {
    if (btn) { btn.disabled = false; btn.style.opacity = ''; }
    toast(String(error.message || '').includes('restaurant_en_pause') ? "Ce restaurant vient de mettre les commandes en pause. Réessayez plus tard." : "La commande n'est pas partie. Vérifiez votre connexion et réessayez.");
    console.error(error);
    return;
  }

  renderConfirmation({ ...payload, created_at: new Date().toISOString() });
  cart = {};
  location_ = null;
  updateHeaderCartBadge();
  hideFeeNotice();
  show('confirm');
}

function renderConfirmation(order) {
  const r = currentRestaurant;
  const el = document.getElementById('view-confirm');
  const waLink = r.whatsapp ? `https://wa.me/${r.whatsapp}?text=${encodeURIComponent("Nouvelle commande Dallas Bouff' #" + order.id.slice(0,8) + ' — ' + order.total + ' F — ' + order.customer_name)}` : null;
  el.innerHTML = `
    <div class="section" style="text-align:center;">
      <div style="width:56px; height:56px; border-radius:50%; background:linear-gradient(135deg,var(--palm),#3F6B48); display:flex; align-items:center; justify-content:center; margin:0 auto 12px;">✓</div>
      <div class="display" style="font-size:26px;">Commande envoyée</div>
      <div style="font-size:13px; color:var(--creamDim); margin-bottom:20px;">${r.name} va recevoir votre commande.</div>
    </div>
    <div class="section" style="padding-top:0;">
      <div class="ticket">
        <div style="text-align:center; margin-bottom:10px;">
          <div class="display" style="font-size:20px; letter-spacing:0.06em;">DALLAS BOUFF'</div>
          <div class="mono" style="font-size:10px; color:#6B5F52;">TAZIBOU · TICKET DE COMMANDE</div>
        </div>
        <div style="border-top:1.5px dashed #B8AA98; border-bottom:1.5px dashed #B8AA98; padding:10px 0; margin:10px 0;">
          <div class="ticket-line"><span>N° COMMANDE</span><span>${order.id.slice(0,8).toUpperCase()}</span></div>
          <div class="ticket-line"><span>RESTAURANT</span><span>${r.name}</span></div>
          <div class="ticket-line"><span>CLIENT</span><span>${escHtml(order.customer_name)}</span></div>
        </div>
        ${order.items.map(i => `<div class="ticket-line"><span>${i.qty}× ${escHtml(i.name)}</span><span>${money(i.price*i.qty)}</span></div>`).join('')}
        <div class="ticket-line" style="border-top:1.5px dashed #B8AA98; margin-top:10px; padding-top:10px;"><span>SOUS-TOTAL</span><span>${money(order.total - (order.delivery_fee || 0))}</span></div>
        <div class="ticket-line"><span>LIVRAISON</span><span>${money(order.delivery_fee || 0)}</span></div>
        <div class="ticket-line" style="font-weight:700; font-size:13px;"><span>TOTAL À PAYER</span><span>${money(order.total)}</span></div>
        ${(order.preferences && order.preferences.length) || order.notes ? `<div class="ticket-prefs"><b>Vos demandes :</b> ${escHtml((order.preferences || []).join(', '))}${order.notes ? `${order.preferences && order.preferences.length ? ' ; ' : ''}${escHtml(order.notes)}` : ''}</div>` : ''}
      </div>
      ${waLink ? `<a href="${waLink}" target="_blank" style="display:block; text-align:center; margin-top:14px; background:var(--palm); color:var(--cream); padding:13px; border-radius:10px; text-decoration:none; font-weight:600; font-size:13px;">Confirmer par WhatsApp</a>` : ''}
      <div style="margin-top:14px;">${clientPushCard()}</div>
      <button class="btn-primary" style="margin-top:4px;" onclick="setActiveNav('commandes'); show('orders'); renderOrders();">Suivre ma commande</button>
      <button class="btn-secondary" style="margin-top:10px;" onclick="resetOrder()">Commander ailleurs</button>
    </div>
  `;
}

function resetOrder() {
  hideFeeNotice();
  cart = {}; location_ = null; currentRestaurant = null;
  updateHeaderCartBadge();
  setActiveNav('home');
  show('list');
}

// ---------- Installation de l'app (bannière) ----------

let deferredInstallPrompt = null;

function isStandalone() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS() {
  return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  showInstallBanner('android');
});

function showInstallBanner(platform) {
  if (isStandalone()) return;
  const banner = document.getElementById('install-banner');
  const sub = document.getElementById('install-banner-sub');
  const btn = document.getElementById('install-banner-btn');
  if (platform === 'ios') {
    sub.textContent = "Appuyez sur Partager, puis « Sur l'écran d'accueil »";
    btn.style.display = 'none';
  } else {
    sub.textContent = "Accédez à l'app en un clic depuis votre écran d'accueil";
    btn.style.display = 'inline-block';
  }
  banner.style.display = 'flex';
}

async function handleInstallClick() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  dismissInstallBanner();
}

function dismissInstallBanner() {
  document.getElementById('install-banner').style.display = 'none';
}

(async () => {
  await loadRestaurants();
  await refreshCustomer();
  if (!currentCustomer && hasSessionBackup()) restoreSession(async () => { await refreshCustomer(); syncClientPush(); });
  syncClientPush();
  if (location.hash === '#commandes') navTo('commandes');
  if (isIOS() && !isStandalone()) showInstallBanner('ios');
})();
</script>
