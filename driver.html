// Ajoute les fonds de carte (rues / satellite) + échelle à une carte Leaflet
function equipMap(map) {
  const streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 19
  });
  const satellite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri, Maxar, Earthstar Geographics', maxZoom: 19
  });
  const satelliteLabels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, pane: 'shadowPane'
  });
  const hybride = L.layerGroup([satellite, satelliteLabels]);

  streets.addTo(map);
  L.control.layers({ 'Rues': streets, 'Satellite': hybride }, null, { collapsed: true }).addTo(map);
  L.control.scale({ imperial: false }).addTo(map);
}

function money(n) { return Number(n).toLocaleString('fr-FR') + ' F'; }

function playNotificationSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.18].forEach(delay => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, now + delay);
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.25, now + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + 0.28);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(now + delay); osc.stop(now + delay + 0.3);
    });
  } catch (e) { /* audio non disponible, on ignore */ }
}

async function loadRestaurantOptions() {
  const { data } = await client.from('restaurants').select('id, name').order('name');
  const sel = document.getElementById('su-restaurant');

function switchAuthTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
  document.getElementById('auth-error').style.display = 'none';
}

function phoneToEmail(phone) {
  return phone.replace(/\s+/g, '') + '@maquisexpress-driver.local';
}

async function signupDriver() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  const name = document.getElementById('su-name').value.trim();
  const phone = document.getElementById('su-phone').value.trim();
  const password = document.getElementById('su-password').value;
  const restaurantId = document.getElementById('su-restaurant').value || null;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  if (!name || !phone || password.length < 6) {
    errEl.textContent = "Merci de remplir tous les champs (mot de passe : 6 caractères minimum).";
    errEl.style.display = 'block';
    return;
  }

  const email = phoneToEmail(phone);
  const { data, error } = await client.auth.signUp({ email, password });
  if (error) {
    errEl.textContent = error.message.includes('already') ? "Ce numéro a déjà un compte livreur." : "Erreur lors de la création du compte.";
    errEl.style.display = 'block';
    return;
  }

  const { error: dError } = await client.from('drivers').insert({
    auth_user_id: data.user.id, name, phone, restaurant_id: restaurantId
  });
  if (dError) {
    errEl.textContent = "Erreur lors de la création du profil livreur.";
    errEl.style.display = 'block';
    return;
  }

  await afterLogin();
}

async function loginDriver() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  const phone = document.getElementById('li-phone').value.trim();
  const password = document.getElementById('li-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';

  const email = phoneToEmail(phone);
  const { error } = await client.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = "Téléphone ou mot de passe incorrect.";
    errEl.style.display = 'block';
    return;
  }
  await afterLogin();
}

async function afterLogin() {
  const { data: { user } } = await client.auth.getUser();
  if (!user) return;

  const { data: driver, error } = await client.from('drivers').select('*, restaurants(name)').eq('auth_user_id', user.id).maybeSingle();
  if (error || !driver) {
    const errEl = document.getElementById('auth-error');
    errEl.textContent = "Aucun profil livreur trouvé pour ce compte.";
    errEl.style.display = 'block';
    await client.auth.signOut();
    return;
  }

  myDriver = driver;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('driver-screen').style.display = 'block';
  document.getElementById('bottom-nav').style.display = 'flex';
  document.getElementById('driver-name').textContent = driver.name;
  document.getElementById('driver-type').textContent = driver.restaurants ? driver.restaurants.name : 'Livreur indépendant';

  refreshOrders();
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshOrders, 8000);

  renderNotifBanner();
}

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

function renderNotifBanner() {
  const el = document.getElementById('notif-banner');
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    el.innerHTML = '';
    return;
  }
  if (Notification.permission === 'granted') {
    el.innerHTML = '<div class="notif-ok">Notifications activées</div>';
  } else {
    el.innerHTML = '<button class="notif-btn" onclick="enableNotifications()">Activer les notifications de livraison</button>';
  }
}

async function enableNotifications() {
  try {
    const reg = await navigator.serviceWorker.register('sw-driver.js');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') { renderNotifBanner(); return; }

    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    const subJson = sub.toJSON();

    await client.from('driver_push_subscriptions').upsert({
      driver_id: myDriver.id,
      endpoint: subJson.endpoint,
      p256dh: subJson.keys.p256dh,
      auth: subJson.keys.auth
    }, { onConflict: 'endpoint' });

    renderNotifBanner();
    toastDriver("Notifications activées !");
  } catch (e) {
    console.error(e);
    alert("Impossible d'activer les notifications sur cet appareil/navigateur.");
  }
}

function toastDriver(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--palm); color:var(--cream); padding:12px 18px; border-radius:10px; font-size:13px; z-index:100;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function logoutDriver() {
  stopGPS();
  await client.auth.signOut();
  if (refreshTimer) clearInterval(refreshTimer);
  myDriver = null;
  document.getElementById('driver-screen').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  document.getElementById('login-screen').style.display = 'block';
}

async function refreshOrders() {
  // Livraison en cours
  const { data: current } = await client.from('orders').select('*, restaurants(name, accent)').eq('driver_id', myDriver.id).eq('status', 'En livraison');
  const curEl = document.getElementById('current-delivery');
  const hasActiveDelivery = current && current.length > 0;

  if (hasActiveDelivery) {
    startGPS();
    const o0 = current[0];
    if (o0.id !== currentDeliveryOrderId) {
      currentDeliveryOrderId = o0.id;
      deliveryMap = null;
      curEl.innerHTML = current.map(o => `
        <div class="order">
          <div style="font-weight:700; font-size:15px;">${o.restaurants ? o.restaurants.name : ''}</div>
          <div style="font-size:13px; margin-top:4px;">${o.customer_name}</div>
          ${o.address ? `<div style="font-size:12.5px; color:var(--creamDim); margin-top:2px;">${o.address}</div>` : ''}
          <div class="mono" style="margin-top:6px; font-weight:700;">${money(o.total)}</div>
          <a href="tel:${o.phone}" class="btn-call">Appeler le client</a>
          <button class="btn-done" onclick="markDelivered('${o.id}')">Marquer comme livrée</button>
          ${o.location && o.location.type === 'gps' ? '<div class="map-wrap"><button class="btn-fullscreen-map" onclick="openFullscreenMap()">⤢ Plein écran</button><div id="delivery-map"></div></div>' : ''}
        </div>
      `).join('');
      if (o0.location && o0.location.type === 'gps') {
        updateDeliveryMap(o0.location);
      }
    }
  } else {
    stopGPS();
    deliveryMap = null;
    currentDeliveryOrderId = null;
    deliveryDestination = null;
    closeFullscreenMap();
    if (fsMap) { fsMap.remove(); fsMap = null; }
    curEl.innerHTML = '<div class="empty">Aucune livraison en cours.</div>';
  }

  const availEl = document.getElementById('available-orders');

  // Tant qu'une livraison est en cours, on ne montre pas les nouvelles commandes disponibles
  if (hasActiveDelivery) {
    availEl.innerHTML = '<div class="empty">Terminez votre livraison en cours avant d\'en prendre une nouvelle.</div>';
    knownAvailableIds = new Set();
    return;
  }

  // Commandes disponibles
  let query = client.from('orders').select('*, restaurants(name, accent)').eq('status', 'Prête').is('driver_id', null);
  if (myDriver.restaurant_id) query = query.eq('restaurant_id', myDriver.restaurant_id);
  const { data: available } = await query;

  if (!available || available.length === 0) {
    availEl.innerHTML = '<div class="empty">Aucune commande disponible pour le moment.</div>';
    knownAvailableIds = new Set();
    return;
  }

  const newIds = new Set(available.map(o => o.id));
  const hasNewOrder = [...newIds].some(id => !knownAvailableIds.has(id));
  if (hasNewOrder && knownAvailableIds.size > 0) playNotificationSound();
  if (knownAvailableIds.size === 0 && newIds.size > 0) playNotificationSound();
  knownAvailableIds = newIds;

  availEl.innerHTML = available.map(o => `
    <div class="order">
      <div style="font-weight:700; font-size:15px;">${o.restaurants ? o.restaurants.name : ''}</div>
      <div style="font-size:13px; margin-top:4px;">${o.customer_name} · ${o.phone}</div>
      ${o.address ? `<div style="font-size:12.5px; color:var(--creamDim); margin-top:2px;">${o.address}</div>` : ''}
      <div class="mono" style="margin-top:6px; font-weight:700;">${money(o.total)}</div>
      <button class="btn-take" onclick="takeOrder('${o.id}')">Je prends cette livraison</button>
    </div>
  `).join('');
}

async function takeOrder(orderId) {
  const { data: active } = await client.from('orders').select('id').eq('driver_id', myDriver.id).eq('status', 'En livraison');
  if (active && active.length > 0) {
    alert("Vous avez déjà une livraison en cours. Terminez-la avant d'en prendre une nouvelle.");
    refreshOrders();
    return;
  }
  const { error } = await client.from('orders').update({ driver_id: myDriver.id, status: 'En livraison' }).eq('id', orderId).is('driver_id', null);
  if (error) { alert("Cette commande vient d'être prise par un autre livreur."); }
  refreshOrders();
}

async function markDelivered(orderId) {
  await client.from('orders').update({ status: 'Livrée' }).eq('id', orderId);
  refreshOrders();
}

function startGPS() {
  const dot = document.getElementById('gps-dot');
  const text = document.getElementById('gps-text');
  if (gpsWatchId !== null) return;
  if (!navigator.geolocation) { text.textContent = "GPS non disponible sur cet appareil"; return; }

  dot.classList.add('active');
  text.textContent = "Partage de votre position en cours…";

  gpsWatchId = navigator.geolocation.watchPosition(
    async (pos) => {
      myCurrentPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      await client.from('drivers').update({
        current_lat: pos.coords.latitude,
        current_lng: pos.coords.longitude,
        location_updated_at: new Date().toISOString()
      }).eq('id', myDriver.id);
      text.textContent = `Position partagée : ${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
      if (deliveryMap && deliveryDriverMarker) {
        deliveryDriverMarker.setLatLng([myCurrentPos.lat, myCurrentPos.lng]);
        if (deliveryCustomerMarker) {
          deliveryRouteLine.setLatLngs([[myCurrentPos.lat, myCurrentPos.lng], deliveryCustomerMarker.getLatLng()]);
        }
      }
      if (fsMap && window.fsDriverMarker) {
        window.fsDriverMarker.setLatLng([myCurrentPos.lat, myCurrentPos.lng]);
        if (window.fsRouteLine) window.fsRouteLine.setLatLngs([[myCurrentPos.lat, myCurrentPos.lng], window.fsCustomerMarker.getLatLng()]);
      }
    },
    () => { text.textContent = "Position GPS refusée — activez-la pour partager votre trajet"; dot.classList.remove('active'); },
    { enableHighAccuracy: true, maximumAge: 5000 }
  );
}

function updateDeliveryMap(destination) {
  deliveryDestination = destination;
  setTimeout(() => {
    const mapEl = document.getElementById('delivery-map');
    if (!mapEl) return;
    const startPos = myCurrentPos || destination;

    deliveryMap = L.map(mapEl).setView([destination.lat, destination.lng], 16);
    equipMap(deliveryMap);

    deliveryCustomerMarker = L.marker([destination.lat, destination.lng]).addTo(deliveryMap).bindPopup('Client');
    deliveryDriverMarker = L.marker([startPos.lat, startPos.lng]).addTo(deliveryMap).bindPopup('Vous');
    deliveryRouteLine = L.polyline([[startPos.lat, startPos.lng], [destination.lat, destination.lng]], { color: '#E8873A', weight: 3, dashArray: '6,6' }).addTo(deliveryMap);
    deliveryMap.fitBounds([[startPos.lat, startPos.lng], [destination.lat, destination.lng]], { padding: [30,30] });
  }, 30);
}

function openFullscreenMap() {
  if (!deliveryDestination) return;
  document.getElementById('map-fullscreen').classList.add('open');

  setTimeout(() => {
    const startPos = myCurrentPos || deliveryDestination;
    if (!fsMap) {
      fsMap = L.map('fs-map').setView([deliveryDestination.lat, deliveryDestination.lng], 17);
      equipMap(fsMap);
      window.fsCustomerMarker = L.marker([deliveryDestination.lat, deliveryDestination.lng]).addTo(fsMap).bindPopup('Client');
      window.fsDriverMarker = L.marker([startPos.lat, startPos.lng]).addTo(fsMap).bindPopup('Vous');
      window.fsRouteLine = L.polyline([[startPos.lat, startPos.lng], [deliveryDestination.lat, deliveryDestination.lng]], { color: '#E8873A', weight: 4, dashArray: '8,8' }).addTo(fsMap);
    }
    fsMap.invalidateSize();
    fsMap.fitBounds([[startPos.lat, startPos.lng], [deliveryDestination.lat, deliveryDestination.lng]], { padding: [40,40] });
  }, 60);
}

function closeFullscreenMap() {
  document.getElementById('map-fullscreen').classList.remove('open');
}

function stopGPS() {
  if (gpsWatchId !== null) { navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId = null; }
  document.getElementById('gps-dot').classList.remove('active');
  document.getElementById('gps-text').textContent = "Position non partagée";
}

(async () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw-driver.js').catch(() => {});
  }
  await loadRestaurantOptions();
  const { data: { session } } = await client.auth.getSession();
  if (session) await afterLogin();
})();
</script>

<div class="map-fullscreen" id="map-fullscreen">
  <button class="map-fullscreen-close" onclick="closeFullscreenMap()">✕</button>
  <div id="fs-map"></div>
</div>
